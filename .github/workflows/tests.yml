name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
env:
  # HackTricks Cloud revision the privesc catalog, ledgers and check page links are verified against.
  HACKTRICKS_REVISION: 171e422299df4e3c1477847d80439c13aadf55fc
  TERRAFORM_VERSION: 1.14.3
jobs:
  python:
    name: Python test suite
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Check out the pinned HackTricks Cloud pages
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: HackTricks-wiki/hacktricks-cloud
          ref: ${{ env.HACKTRICKS_REVISION }}
          path: .hacktricks-cloud
          sparse-checkout: src
          persist-credentials: false
      - name: Check out the exact Azure provenance revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: HackTricks-wiki/hacktricks-cloud
          ref: 4913b6d88ced9972f72ccdd708d21641725a6fb5
          path: .hacktricks-cloud-azure
          sparse-checkout: src
          persist-credentials: false
      - name: Check out the exact Kubernetes provenance revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: HackTricks-wiki/hacktricks-cloud
          ref: 4202559da31f53bb101052ab4622a636d243c4a5
          path: .hacktricks-cloud-k8s
          sparse-checkout: src
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/tests.yml
      - name: Install test dependencies
        # Exact versions of the environment the suite was verified with. The suite imports the
        # cloud SDKs (collectors), duckdb (analytics), moto (hosted API/worker/workflow fixtures),
        # jsonschema (privesc schema cross-check) and fastapi/httpx (API tests).
        run: >-
          python -m pip install --retries 5 --timeout 30 --constraint infra/aws/sdk-constraints.txt
          'PyYAML==6.0.3' 'fastapi==0.128.0' 'uvicorn==0.32.1' 'cryptography==46.0.3' 'PyJWT[crypto]==2.10.1'
          'boto3==1.43.38' 'requests==2.32.5' 'google-auth==2.45.0'
          'azure-identity==1.25.1' 'azure-mgmt-resource==24.0.0' 'azure-mgmt-authorization==4.0.0'
          'azure-mgmt-monitor==7.0.0' 'kubernetes==35.0.0' 'termcolor==3.2.0' 'tqdm==4.67.1'
          'duckdb==1.5.6' 'jsonschema==4.26.0' 'moto[dynamodb,s3,stepfunctions]==5.2.3' 'httpx==0.28.1'
          'pytest==9.0.2' 'pytest-xdist==3.8.0' 'setuptools==84.0.0' 'wheel==0.48.0'
      - name: Install Terraform (compiles the hosted workflow definition in tests)
        run: |
          base="https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}"
          archive="terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          curl --fail --silent --show-error --location --retry 5 -o "$RUNNER_TEMP/$archive" "$base/$archive"
          curl --fail --silent --show-error --location --retry 5 -o "$RUNNER_TEMP/SHA256SUMS" "$base/terraform_${TERRAFORM_VERSION}_SHA256SUMS"
          (cd "$RUNNER_TEMP" && grep " $archive\$" SHA256SUMS | sha256sum -c -)
          unzip -q -o "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP/terraform"
          echo "PEASO_TERRAFORM=$RUNNER_TEMP/terraform/terraform" >> "$GITHUB_ENV"
      - name: Fetch exact source objects cited by the active catalog
        run: |
          python - <<'PYTHON'
          import json, re, subprocess
          from pathlib import Path
          sources = json.loads(Path('tests/fixtures/hacktricks-source-revisions.json').read_text())
          revisions = sources['revisions']
          assert revisions and all(re.fullmatch(r'[0-9a-f]{40}', rev) for rev in revisions)
          subprocess.run(['git', '-C', '.hacktricks-cloud', 'fetch', '--no-tags', '--depth=1', 'origin', *revisions], check=True)
          PYTHON
      - name: Run the performance gate in isolation
        id: benchmark
        # Measure before the large suite imports its fixtures and allocates worker heaps.
        run: python -m pytest -q -s -p no:cacheprovider -rs --junitxml=benchmark-report.xml tests/test_peaso_perf_benchmark.py
      - name: Profile a failed performance gate
        if: ${{ failure() && steps.benchmark.outcome == 'failure' }}
        run: |
          python -m cProfile -o "$RUNNER_TEMP/evaluate.prof" tests/test_peaso_perf_benchmark.py 1x
          python - "$RUNNER_TEMP/evaluate.prof" <<'PYTHON'
          import pstats, sys
          pstats.Stats(sys.argv[1]).strip_dirs().sort_stats('cumulative').print_stats(30)
          PYTHON
      - name: Run the test suite
        env:
          HACKTRICKS_CLOUD_ROOT: ${{ github.workspace }}/.hacktricks-cloud:${{ github.workspace }}/.hacktricks-cloud-azure:${{ github.workspace }}/.hacktricks-cloud-k8s
          PEASO_HACKTRICKS_ROOT: ${{ github.workspace }}/.hacktricks-cloud
        # --dist loadfile keeps each module's expensive fixtures on one worker.
        run: python -m pytest -q -p no:cacheprovider -n auto --dist loadfile -rs --ignore=tests/test_peaso_perf_benchmark.py --junitxml=pytest-report.xml tests
      - name: Fail on unexpected performance skips
        if: ${{ !cancelled() && steps.benchmark.outcome != 'skipped' }}
        run: python scripts/check_test_skips.py pytest benchmark-report.xml
      - name: Fail on unexpected skips
        if: ${{ !cancelled() }}
        run: python scripts/check_test_skips.py pytest pytest-report.xml
  frontend:
    name: Frontend typecheck, build and Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright tests (fixture-backed; live-backend specs skip without their tokens)
        env:
          CI: '1'
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results.json
          # Nothing listens here: any unmocked API call fails instead of reaching a real backend.
          PEASO_API_ORIGIN: http://127.0.0.1:9
        run: npx playwright test --reporter=list,json
      - name: Fail on unexpected skips
        if: ${{ !cancelled() }}
        run: python ../scripts/check_test_skips.py playwright playwright-results.json
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
