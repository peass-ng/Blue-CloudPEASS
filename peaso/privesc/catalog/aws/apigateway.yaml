# AWS API Gateway privilege escalation techniques.
# Source: hacktricks-cloud aws-apigateway-privesc/README.md.

- id: aws-apigateway-integration-credentials-passrole
  provider: aws
  service: apigateway
  title: Create a REST API AWS-service integration that runs with a passed credentials role
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-apigateway-privesc/README.md#apigatewayput-apigatewaypost-and-sometimes-iampassrole
  source_revision: a53b46392c
  summary: The source can obtain the privileges of passable roles trusting apigateway.amazonaws.com by using them as the execution credentials of an AWS-service integration it can invoke.
  requires:
    all_of:
      - action: apigateway:PUT
        resource: "*"
      - action: apigateway:POST
        resource: "*"
      - action: iam:PassRole
        resource: "{target.arn}"
  target:
    kind: aws_role
    selector:
      trust_allows_service: apigateway.amazonaws.com
    scope: same_account
    aggregate_as: "Roles trusting apigateway.amazonaws.com in {account}"
  conditions:
    - id: integration_action_limited
      description: An AWS-service integration calls one configured service action per integration; the source can create several, but reachable actions are those exposed by AWS integrations, so effective privilege is close to but not always fully the role's.
    - id: deployment_or_testinvoke
      description: The integration must be invoked, which needs a deployment (POST) or apigateway test invocation; resource policies or authorizers on existing APIs do not apply to new APIs the source creates.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Restrict iam:PassRole for apigateway.amazonaws.com roles and apigateway write actions to API administrators.
  references:
    - https://docs.aws.amazon.com/apigateway/latest/developerguide/integrating-api-with-aws-services-s3.html
  notes: Not verified against live docs during authoring (doc fetch failed); based on the documented integration credentials model. Existing integrations already holding a role are reachable with PATCH+POST without PassRole (role attached to an integration); the evaluator may model that as attached_resource_covered_by apigateway:PATCH.
