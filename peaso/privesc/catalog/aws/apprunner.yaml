# AWS privilege escalation catalog: include only a known principal gaining another
# exact principal or new effective permissions through specified actions. A secret,
# token, API key, or password read is an edge only after evidence proves its exact
# credential subject, usability, and additional authority. Generic data disclosure,
# application effects, and unknown targets are not privilege escalation paths.

# AWS App Runner privilege escalation techniques.
# Source: hacktricks-cloud aws-apprunner-privesc/README.md.

- id: aws-apprunner-passrole-createservice
  provider: aws
  service: apprunner
  title: Create an App Runner service with a passed instance role
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-apprunner-privesc/README.md#iampassrole-apprunnercreateservice
  source_revision: 6fb9ac51fd
  summary: The source can obtain the privileges of passable roles trusting tasks.apprunner.amazonaws.com by running
    code it controls in a new App Runner service using that instance role.
  requires:
    all_of:
    - action: iam:PassRole
      resource: '{target.arn}'
    - action: apprunner:CreateService
      resource: '*'
  target:
    kind: aws_role
    selector:
      trust_allows_service: tasks.apprunner.amazonaws.com
      resource_permission_covers_target: iam:PassRole
    scope: same_account
    aggregate_as: Roles trusting tasks.apprunner.amazonaws.com in {account}
    outcome: workload_execution
  conditions:
  - id: passrole_condition_key
    description: iam:PassedToService conditions may restrict this.
  - id: image_source
    description: The source needs a code repository connection or an image it can supply (public ECR image or private
      ECR with an access role).
  blockers:
  - scp_or_boundary_deny
  confidence: derived
  severity: critical
  mitigation: Restrict iam:PassRole on App Runner instance roles with iam:PassedToService and specific role ARNs.
  references:
  - https://docs.aws.amazon.com/apprunner/latest/dg/security_iam_service-with-iam.html
  notes: Severity critical because a reachable instance role can be admin-equivalent.


- id: aws-apprunner-updateservice-passrole
  provider: aws
  service: apprunner
  title: Repoint an existing App Runner service to a passed instance role
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-apprunner-privesc/README.md#apprunnerupdateservice
  source_revision: 6fb9ac51fd
  summary: The source can obtain the privileges of passable roles trusting tasks.apprunner.amazonaws.com by updating an existing App Runner service to use that instance role together with code or a start command it controls.
  requires:
    all_of:
      - action: iam:PassRole
        resource: "{target.arn}"
      - action: apprunner:UpdateService
        resource: "*"
  target:
    kind: aws_role
    selector:
      trust_allows_service: tasks.apprunner.amazonaws.com
      resource_permission_covers_target: iam:PassRole
    scope: same_account
    aggregate_as: "Roles trusting tasks.apprunner.amazonaws.com passable in {account}"
    outcome: workload_execution
  conditions:
    - id: existing_service
      description: At least one existing App Runner service must be covered by apprunner:UpdateService.
    - id: passrole_condition_key
      description: iam:PassedToService conditions may restrict which roles can be passed.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict apprunner:UpdateService to deployment pipelines and iam:PassRole on App Runner instance roles with iam:PassedToService and exact role ARNs.
  references:
    - https://docs.aws.amazon.com/apprunner/latest/api/API_UpdateService.html
  notes: Companion of aws-apprunner-updateservice (keeps the existing role, no PassRole); the page notes that changing role-bearing configuration triggers iam:PassRole.
- id: aws-apprunner-plaintext-credential
  provider: aws
  service: apprunner
  title: DescribeService returns plaintext environment credentials
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-apprunner-privesc/README.md#apprunnerdescribeservice--read-plaintext-runtime-variables
  source_revision: 57bd5c07df
  summary: A verified exposed AWS credential for another principal can be read by the source.
  requires:
    all_of:
    - action: apprunner:DescribeService
      resource: '*'
  target:
    kind: aws_user
    selector:
      aws_challenge_fact: aws-apprunner-plaintext-credential
    scope: same_account
    outcome: credentials
    grants:
    - Exact IAM user authenticated by a reviewed usable access key in the named resource
  conditions:
  - id: exact_credential_subject_resource
    description: A reviewed evidence record must bind the source IAM principal, exact readable resource
      and action, credential subject IAM user, usable access key and evidence reference; the source must
      hold effective permission on that resource.
  confidence: conditional
  severity: high
  mitigation: Restrict the listed action to approved operators and protect exposed credentials.
  notes: Only a direct IAM user access key is modeled. STS and application sessions remain held because
    their effective rights may be narrower than the role or application identity.
