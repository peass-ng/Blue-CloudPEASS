# AWS Batch privilege escalation techniques.
# Source: hacktricks-cloud aws-batch-privesc/README.md.

- id: aws-batch-submitjob-existing-definition
  provider: aws
  service: batch
  title: Submit a job using an existing job definition with a job role
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-batch-privesc/README.md#batchsubmitjob
  source_revision: a53b46392c
  summary: The source can obtain the privileges of the job role of an existing job definition by submitting a job with a container command override.
  requires:
    all_of:
      - action: batch:SubmitJob
        resource: "{target.attached_resource_arn}"
  target:
    kind: aws_role
    selector:
      attached_to_service: batch
      attached_resource_covered_by: batch:SubmitJob
    scope: same_account
    aggregate_as: "Job roles of Batch job definitions covered by batch:SubmitJob in {account}"
  conditions:
    - id: job_queue_covered
      description: batch:SubmitJob must cover both the job definition and a job queue (Resource includes both ARNs).
  blockers:
    - scp_or_boundary_deny
  confidence: derived
  severity: high
  mitigation: Scope batch:SubmitJob to specific job definitions and queues; keep job roles least-privileged.
  references:
    - https://docs.aws.amazon.com/batch/latest/userguide/batch-supported-iam-actions-resources.html
  notes: Registering a new job definition with a passed role (batch:RegisterJobDefinition + iam:PassRole, roles trusting ecs-tasks.amazonaws.com) is an analogous path not documented in this HackTricks page; not included. Compute-environment instance roles may also be reachable from EC2-backed jobs.
