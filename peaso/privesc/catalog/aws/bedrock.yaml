# AWS Bedrock / Bedrock AgentCore privilege escalation techniques.
# Source: hacktricks-cloud aws-bedrock-privesc/README.md.

- id: aws-bedrock-agentcore-codeinterpreter-existing
  provider: aws
  service: bedrock
  title: Run code in an existing AgentCore Code Interpreter with an execution role
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-bedrock-privesc/README.md#bedrock-agentcorestartcodeinterpretersession--bedrock-agentcoreinvokecodeinterpreter---code-interpreter-execution-role-pivot
  source_revision: a53b46392c
  summary: The source can obtain the privileges of the execution role of a custom AgentCore Code Interpreter it can start sessions in and invoke.
  requires:
    all_of:
      - action: bedrock-agentcore:StartCodeInterpreterSession
        resource: "{target.attached_resource_arn}"
      - action: bedrock-agentcore:InvokeCodeInterpreter
        resource: "{target.attached_resource_arn}"
  target:
    kind: aws_role
    selector:
      attached_to_service: bedrock-agentcore
      attached_resource_covered_by: bedrock-agentcore:InvokeCodeInterpreter
    scope: same_account
    aggregate_as: "Execution roles of AgentCore Code Interpreters covered by bedrock-agentcore:InvokeCodeInterpreter in {account}"
  conditions:
    - id: network_mode
      description: Credentials can be used from inside the interpreter regardless of network mode; exfiltration outside AWS depends on PUBLIC/VPC mode, but in-sandbox use of the role still grants its privileges.
  blockers:
    - scp_or_boundary_deny
  confidence: derived
  severity: high
  mitigation: Restrict StartCodeInterpreterSession/InvokeCodeInterpreter on custom interpreters and keep their execution roles least-privileged.
  references: []
  notes: The AWS-managed default interpreter has no customer execution role and is not a target.

- id: aws-bedrock-agentcore-createcodeinterpreter-passrole
  provider: aws
  service: bedrock
  title: Create an AgentCore Code Interpreter with a passed execution role and run code in it
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-bedrock-privesc/README.md#bedrock-agentcorestartcodeinterpretersession--bedrock-agentcoreinvokecodeinterpreter---code-interpreter-execution-role-pivot
  source_revision: a53b46392c
  summary: The source can obtain the privileges of passable roles trusting bedrock-agentcore.amazonaws.com by creating a Code Interpreter with that execution role and invoking it.
  requires:
    all_of:
      - action: bedrock-agentcore:CreateCodeInterpreter
        resource: "*"
      - action: iam:PassRole
        resource: "{target.arn}"
      - action: bedrock-agentcore:StartCodeInterpreterSession
        resource: "*"
      - action: bedrock-agentcore:InvokeCodeInterpreter
        resource: "*"
  target:
    kind: aws_role
    selector:
      trust_allows_service: bedrock-agentcore.amazonaws.com
    scope: same_account
    aggregate_as: "Roles trusting bedrock-agentcore.amazonaws.com in {account}"
  conditions:
    - id: passrole_condition_key
      description: iam:PassedToService conditions may restrict this.
  blockers:
    - scp_or_boundary_deny
  confidence: derived
  severity: high
  mitigation: Restrict iam:PassRole for AgentCore execution roles and bedrock-agentcore:CreateCodeInterpreter.
  references: []
  notes: HackTricks lists CreateCodeInterpreter as an optional extension of the existing-interpreter technique.

- id: aws-bedrock-agent-lambda-actiongroup-hijack
  provider: aws
  service: bedrock
  title: Modify a Lambda action-group function and trigger it through a Bedrock agent
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-bedrock-privesc/README.md#lambdaupdatefunctioncode-bedrockinvokeagent---agent-tool-hijacking-via-lambda
  source_revision: a53b46392c
  summary: The source can obtain the privileges of the execution role of a Lambda function used as a Bedrock agent action group by changing its code and invoking the agent.
  requires:
    all_of:
      - action: lambda:UpdateFunctionCode
        resource: "{target.attached_resource_arn}"
      - action: bedrock:InvokeAgent
        resource: "*"
  target:
    kind: aws_role
    selector:
      attached_to_service: lambda
      attached_resource_covered_by: lambda:UpdateFunctionCode
    scope: same_account
    aggregate_as: "Execution roles of Lambda functions behind Bedrock agent action groups in {account}"
  conditions:
    - id: function_is_action_group
      description: The covered function must be the executor of an action group of a Bedrock agent alias that the source can invoke (bedrock:InvokeAgent Resource is the agent-alias ARN).
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Restrict lambda:UpdateFunctionCode on agent tool functions and keep their execution roles least-privileged.
  references:
    - https://docs.aws.amazon.com/bedrock/latest/APIReference/API_agent_AgentActionGroup.html
  notes: Alternative trigger to lambda:InvokeFunction; the generic UpdateFunctionCode technique is in lambda.yaml (part B).
