# AWS privilege escalation catalog: include only a known principal gaining another
# exact principal or new effective permissions through specified actions. A secret,
# token, API key, or password read is an edge only after evidence proves its exact
# credential subject, usability, and additional authority. Generic data disclosure,
# application effects, and unknown targets are not privilege escalation paths.

# AWS CloudFormation privilege escalation techniques.
# Source: hacktricks-cloud aws-cloudformation-privesc/ (README.md and sub-page).

- id: aws-cloudformation-passrole-createstack
  provider: aws
  service: cloudformation
  title: Create a stack with a passed CloudFormation service role
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-cloudformation-privesc/README.md#iampassrole-cloudformationcreatestack
  source_revision: 171e422299
  summary: The source can obtain the privileges of passable roles trusting cloudformation.amazonaws.com by deploying a template it controls with that service role.
  requires:
    all_of:
      - action: iam:PassRole
        resource: "{target.arn}"
      - action: cloudformation:CreateStack
        resource: "*"
  target:
    kind: aws_role
    selector:
      trust_allows_service: cloudformation.amazonaws.com
    scope: same_account
    aggregate_as: "Roles trusting cloudformation.amazonaws.com in {account}"
  conditions:
    - id: passrole_condition_key
      description: iam:PassedToService / cloudformation:RoleArn conditions may restrict this.
    - id: template_location
      description: The template must be supplied from S3 (HTTPS URL) or inline; an S3 location readable by CloudFormation is needed.
  blockers:
    - scp_or_boundary_deny
  confidence: derived
  severity: critical
  mitigation: Restrict iam:PassRole on CloudFormation service roles and use the cloudformation:RoleArn condition key.
  references:
    - https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/using-iam-servicerole.html
  notes: The sub-page iam-passrole-cloudformation-createstack-and-cloudformation-describestacks.md describes the same edge (DescribeStacks only helps read outputs). Severity critical because CloudFormation service roles are frequently admin-equivalent.

- id: aws-cloudformation-passrole-updatestack
  provider: aws
  service: cloudformation
  title: Update a stack with a passed CloudFormation service role
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-cloudformation-privesc/README.md#iampassrole-cloudformationupdatestack-and-where-needed-cloudformationsetstackpolicy
  source_revision: 171e422299
  summary: The source can obtain the privileges of passable roles trusting cloudformation.amazonaws.com by updating an existing stack with a template it controls and that role.
  requires:
    all_of:
      - action: iam:PassRole
        resource: "{target.arn}"
      - action: cloudformation:UpdateStack
        resource: "*"
  target:
    kind: aws_role
    selector:
      trust_allows_service: cloudformation.amazonaws.com
    scope: same_account
    aggregate_as: "Roles trusting cloudformation.amazonaws.com in {account}"
  conditions:
    - id: stack_policy
      description: A stack policy denying updates may require cloudformation:SetStackPolicy (or a temporary override policy on the update).
    - id: passrole_condition_key
      description: iam:PassedToService / cloudformation:RoleArn conditions may restrict this.
  blockers:
    - scp_or_boundary_deny
  confidence: derived
  severity: critical
  mitigation: Restrict iam:PassRole on CloudFormation service roles and use the cloudformation:RoleArn condition key.
  references: []
  notes: Needs at least one existing stack covered by cloudformation:UpdateStack.

- id: aws-cloudformation-passrole-changeset
  provider: aws
  service: cloudformation
  title: Create and execute a change set with a passed service role
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-cloudformation-privesc/README.md#iampassrole-cloudformationcreatechangeset-cloudformationexecutechangeset-and-where-needed-cloudformationsetstackpolicy
  source_revision: 171e422299
  summary: The source can obtain the privileges of passable roles trusting cloudformation.amazonaws.com by creating and executing a change set with that role.
  requires:
    all_of:
      - action: iam:PassRole
        resource: "{target.arn}"
      - action: cloudformation:CreateChangeSet
        resource: "*"
      - action: cloudformation:ExecuteChangeSet
        resource: "*"
  target:
    kind: aws_role
    selector:
      trust_allows_service: cloudformation.amazonaws.com
    scope: same_account
    aggregate_as: "Roles trusting cloudformation.amazonaws.com in {account}"
  conditions:
    - id: stack_policy
      description: Updating an existing stack with a deny stack policy may require cloudformation:SetStackPolicy.
  blockers:
    - scp_or_boundary_deny
  confidence: derived
  severity: critical
  mitigation: Restrict iam:PassRole on CloudFormation service roles and use the cloudformation:RoleArn condition key.
  references: []
  notes: A CREATE-type change set can create a new stack, so no existing stack is required.

- id: aws-cloudformation-passrole-stackset
  provider: aws
  service: cloudformation
  title: Create or update a self-managed StackSet with a passed administration role
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-cloudformation-privesc/README.md#iampassrole-cloudformationcreatestackset--cloudformationupdatestackset
  source_revision: 6fb9ac51fd
  summary: The source can obtain the privileges of the StackSet execution roles in the accounts the passed administration
    role can assume, by deploying a template it controls through a self-managed StackSet.
  pivot_resource_type: aws_stackset_administration_role
  requires:
    all_of:
    - action: iam:PassRole
      resource: '{pivot}'
    any_of:
    - - action: cloudformation:CreateStackSet
        resource: '*'
      - action: cloudformation:CreateStackInstances
        resource: '*'
    - - action: cloudformation:UpdateStackSet
        resource: '*'
  target:
    kind: aws_role
    selector:
      assumable_by_pivot_role: true
    scope: org
    aggregate_as: StackSet execution roles assumable by passable administration roles (from {account})
  conditions:
  - id: execution_role_name_chosen_by_source
    description: The source chooses ExecutionRoleName (default AWSCloudFormationStackSetExecutionRole), so any role
      in a target account that the administration role can assume is reachable, not only the default name.
  - id: target_account_reachable
    description: CloudFormation must be able to deploy stack instances in the execution role's account and region
      (account and region enabled, no failure-tolerance abort).
  - id: passrole_condition_key
    description: iam:PassedToService conditions may restrict which administration roles can be passed.
  - id: service_managed_stacksets
    description: Service-managed StackSets do not use a passed role and are not covered by this entry. The service-managed
      variant is covered by aws-cloudformation-service-managed-stackset-org-members.
  blockers:
  - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict iam:PassRole on StackSet administration roles, scope the administration role's sts:AssumeRole
    to specific execution roles, and scope execution-role trust policies to the administration role ARN.
  references:
  - https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stacksets-prereqs-self-managed.html
  - https://docs.aws.amazon.com/service-authorization/latest/reference/list_awscloudformation.html
  notes: '{pivot} is the StackSet administration role (a role trusting cloudformation.amazonaws.com that the source
    can pass). The target is each execution role that the pivot can assume: the execution role''s trust allows the
    pivot role or its account, and the pivot role''s identity policy allows sts:AssumeRole on it. The Service Authorization
    Reference lists iam:PassRole as a dependent action of CreateStackSet and UpdateStackSet and none for CreateStackInstances.'


- id: aws-cloudformation-registertype-passrole-extension
  provider: aws
  service: cloudformation
  title: Register a private CloudFormation extension with a passed execution role and invoke it
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-cloudformation-privesc/README.md#cloudformationregistertype-iampassrole-and-an-extension-invocation-path
  source_revision: 171e422299
  summary: The source can obtain the privileges of passable roles trusting resources.cloudformation.amazonaws.com, because the handler code of a private resource type or Hook it registers runs with the passed execution role when invoked.
  requires:
    all_of:
      - action: iam:PassRole
        resource: "{target.arn}"
      - action: cloudformation:RegisterType
        resource: "*"
    any_of:
      - - action: cloudformation:CreateResource
          resource: "*"
      - - action: cloudformation:CreateStack
          resource: "*"
      - - action: cloudformation:UpdateStack
          resource: "*"
      - - action: cloudformation:SetTypeConfiguration
          resource: "*"
  target:
    kind: aws_role
    selector:
      trust_allows_service: resources.cloudformation.amazonaws.com
      resource_permission_covers_target: iam:PassRole
    scope: same_account
    aggregate_as: "CloudFormation extension execution roles (trusting resources.cloudformation.amazonaws.com) passable in {account}"
  conditions:
    - id: handler_package_readable
      description: The source must be able to supply a handler package in S3 that CloudFormation can read during registration.
    - id: invocation_path
      description: The registered type must be invoked (Cloud Control CreateResource, a stack operation using the type, or an enabled Hook targeting a later operation); a Hook needs SetTypeConfiguration and a subsequent matching operation.
    - id: passrole_condition_key
      description: iam:PassedToService conditions on the PassRole grant may restrict passing the execution role.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict cloudformation:RegisterType/ActivateType to platform administrators, restrict iam:PassRole on extension execution roles, and keep extension roles least-privileged.
  references:
    - https://docs.aws.amazon.com/AWSCloudFormation/latest/APIReference/API_RegisterType.html
    - https://docs.aws.amazon.com/cloudformation-cli/latest/userguide/resource-type-develop.html
  notes: Extension execution roles trust resources.cloudformation.amazonaws.com, not cloudformation.amazonaws.com, so the target set is disjoint from stack service roles. cloudformation:ActivateType of a third-party public extension with an execution role is a related path but runs code the source does not author unless it published that extension.

- id: aws-cloudformation-service-managed-stackset-org-members
  provider: aws
  service: cloudformation
  title: Deploy a service-managed StackSet into organization member accounts
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-cloudformation-privesc/README.md#cloudformation-stacksets
  source_revision: b587e6bd26
  summary: A management-account principal that can create a service-managed StackSet and deploy its own template to member accounts can gain the effective permissions of the service-managed execution roles there.
  requires:
    all_of:
      - action: cloudformation:CreateStackSet
        resource: "arn:aws:cloudformation:*:{source.account}:stackset/*"
        bind: stackset
      - action: cloudformation:CreateStackInstances
        resource: "arn:aws:cloudformation:*:{source.account}:stackset/*"
        bind: stackset
  target:
    kind: aws_account_admin
    selector:
      any_principal_in_scope: true
      org_member_account: true
    scope: org
    aggregate_as: "Member accounts reachable through service-managed StackSets"
    outcome: scope_control
  conditions:
    - id: trusted_access_enabled
      description: Trusted access between CloudFormation StackSets and AWS Organizations must be enabled (it creates the stacksets-exec execution roles with administrator access in member accounts).
    - id: service_managed_permission_model
      description: The new StackSet must use the SERVICE_MANAGED permission model and target the member account's organizational unit in CreateStackInstances.
    - id: delegated_administrator
      description: A registered StackSets delegated administrator (CallAs DELEGATED_ADMIN) can also deploy, but this entry draws edges only from the management account.
    - id: management_account_not_targeted
      description: Service-managed StackSets never deploy to the management account; member-account SCPs still constrain the template's resources.
  preconditions:
    - source_in_org_management_account
    - target_in_other_account
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict cloudformation:CreateStackSet, CreateStackInstances and UpdateStackSet in the management and delegated-administrator accounts to deployment roles, keep the management account free of workloads, and review delegated StackSets administrators and auto-deployment OUs.
  references:
    - https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stacksets-orgs-activate-trusted-access.html
    - https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stacksets-orgs-delegated-admin.html
  notes: Complements aws-cloudformation-passrole-stackset and aws-cloudformation-updatestackset-attached, which model self-managed StackSets only (their service_managed_stacksets / stackset_permission_model conditions). No iam:PassRole is involved. StackSet permission model, trusted-access state and delegated administrators are not collected, so the edge stays conditional.
