# Amazon EMR privilege escalation techniques.
# Source: hacktricks-cloud aws-emr-privesc/README.md (rev a53b46392c).
# Uses {target.resource_arn}, {target.artifact_arn}, via_resource_type and via_artifact_type (see header of lambda.yaml).

- id: aws-emr-passrole-runjobflow
  provider: aws
  service: emr
  title: Launch an EMR cluster with a passed EC2 instance profile
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-emr-privesc/README.md#iampassrole-elasticmapreducerunjobflow
  source_revision: a53b46392c
  summary: The source can obtain the privileges of any passable EC2-trusting role with an instance profile, used as the EMR cluster instance profile.
  requires:
    all_of:
      - action: iam:PassRole
        resource: "{target.arn}"
      - action: elasticmapreduce:RunJobFlow
        resource: "*"
  target:
    kind: aws_role
    selector:
      trust_allows_service: ec2.amazonaws.com
      has_instance_profile: true
      resource_permission_covers_target: iam:PassRole
    scope: same_account
    aggregate_as: "EC2 instance-profile roles passable in {account}"
  conditions:
    - id: emr_service_role_passable
      description: RunJobFlow also requires passing an EMR service role (or the default EMR_DefaultRole must exist and be passable); PassRole must cover it too.
    - id: passrole_condition_key
      description: iam:PassedToService conditions may restrict which roles can be passed.
  blockers:
    - scp_or_boundary_deny
  confidence: derived
  severity: critical
  mitigation: Restrict iam:PassRole on EC2 instance-profile and EMR service roles with iam:PassedToService, and restrict elasticmapreduce:RunJobFlow.
  references:
    - https://docs.aws.amazon.com/emr/latest/ManagementGuide/emr-iam-role-for-ec2.html
  notes: The EMR service role itself is not reachable (only used by the EMR control plane); the reachable role is the EC2 instance profile role.

- id: aws-emr-addjobflowsteps
  provider: aws
  service: emr
  title: Add steps to an existing EMR cluster
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-emr-privesc/README.md#elasticmapreduceaddjobflowsteps--execute-as-an-existing-cluster-instance-profile
  source_revision: a53b46392c
  summary: The source can obtain the privileges of the EC2 instance-profile role of existing EMR clusters in Resource scope.
  requires:
    all_of:
      - action: elasticmapreduce:AddJobFlowSteps
        resource: "{target.resource_arn}"
  target:
    kind: aws_role
    selector:
      has_instance_profile: true
      via_resource_type: emr_cluster
    scope: same_account
    aggregate_as: "Instance-profile roles of running EMR clusters in {account}"
  conditions:
    - id: cluster_running
      description: The cluster must be running (WAITING/RUNNING) at the time of abuse.
    - id: runtime_role
      description: Clusters using EMR runtime roles for steps run steps as the step runtime role (requiring iam:PassRole on it) instead of the instance profile.
  blockers:
    - scp_or_boundary_deny
  confidence: derived
  severity: critical
  mitigation: Restrict elasticmapreduce:AddJobFlowSteps to pipeline principals on specific cluster ARNs and use EMR runtime roles.
  references:
    - https://docs.aws.amazon.com/emr/latest/ManagementGuide/emr-steps-runtime-roles.html
  notes: Only clusters existing at snapshot time.

- id: aws-emr-s3-putobject-bootstrap-or-step-script
  provider: aws
  service: emr
  title: Overwrite an S3 bootstrap action or step script used by EMR
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-emr-privesc/README.md#s3putobject-on-a-configured-bootstrap-or-step-script
  source_revision: a53b46392c
  summary: The source can obtain the privileges of the instance-profile role of EMR clusters that later execute the writable script.
  requires:
    all_of:
      - action: s3:PutObject
        resource: "{target.artifact_arn}"
  target:
    kind: aws_role
    selector:
      has_instance_profile: true
      via_artifact_type: s3_object
    scope: same_account
    aggregate_as: "EMR instance-profile roles executing writable S3 scripts in {account}"
  conditions:
    - id: later_execution
      description: A new cluster launch (bootstrap) or a new step referencing the key must occur after the overwrite.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Keep bootstrap and step scripts in buckets writable only by the deployment pipeline and reference immutable versioned keys.
  references:
    - https://docs.aws.amazon.com/emr/latest/ManagementGuide/emr-plan-bootstrap.html
  notes: Artifact set requires collecting cluster/launch-template bootstrap actions and step definitions.
