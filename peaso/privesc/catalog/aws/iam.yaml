- id: aws-iam-modify-assumable-role-policy
  provider: aws
  service: iam
  title: Grant permissions to a role the source can already assume
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamattachrolepolicy-stsassumerole--iamcreaterole--iamputuserpolicy--iamputgrouppolicy--iamputrolepolicy
  source_revision: 6bdd8e89e6
  summary: A principal that can attach or put policies on a role whose trust policy allows the source to assume it can make that role admin and assume it.
  requires:
    all_of:
      - action: sts:AssumeRole
        resource: "{target.arn}"
    any_of:
      - - action: iam:AttachRolePolicy
          resource: "{target.arn}"
      - - action: iam:PutRolePolicy
          resource: "{target.arn}"
  target:
    kind: aws_account_admin
    selector:
      via_assumable_role_covered_by: iam:AttachRolePolicy
    scope: same_account
    aggregate_as: "Administrator of {account} (via an assumable role)"
  conditions:
    - id: same_account_trust_no_assumerole_needed
      description: When the role trust names the source principal ARN directly in the same account, sts:AssumeRole in the source's identity policy is not required.
  blockers:
    - scp_or_boundary_deny
  confidence: derived
  severity: critical
  mitigation: Separate who can edit a role's permissions from who can assume it; apply permissions boundaries on delegated role administration.
  references: []
  notes: via_assumable_role_covered_by applies to whichever any_of action matched (AttachRolePolicy or PutRolePolicy).

- id: aws-iam-createrole-attach-assume
  provider: aws
  service: iam
  title: Create a new role trusting the source, grant it admin, and assume it
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamattachrolepolicy-stsassumerole--iamcreaterole--iamputuserpolicy--iamputgrouppolicy--iamputrolepolicy
  source_revision: 6bdd8e89e6
  summary: A principal that can create a role, give it permissions and assume it effectively becomes administrator.
  requires:
    all_of:
      - action: iam:CreateRole
        resource: "*"
      - action: sts:AssumeRole
        resource: "*"
    any_of:
      - - action: iam:AttachRolePolicy
          resource: "*"
      - - action: iam:PutRolePolicy
          resource: "*"
  target:
    kind: aws_account_admin
    selector:
      same_as_source: true
    scope: same_account
    aggregate_as: "Administrator of {account} (via a newly created role)"
  conditions:
    - id: permissions_boundary_condition
      description: An iam:PermissionsBoundary condition on CreateRole forces new roles to carry a boundary and removes the escalation.
    - id: resource_path_restriction
      description: If CreateRole/AttachRolePolicy/AssumeRole are restricted to a role path or name pattern, the actions must all cover the same role ARN.
    - id: same_account_trust_no_assumerole_needed
      description: A role trust naming the source ARN in the same account makes the sts:AssumeRole identity grant unnecessary.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Require iam:PermissionsBoundary on iam:CreateRole for delegated administrators and restrict role attach/put to boundary-carrying roles.
  references:
    - https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html
  notes: "Resource \"*\" means the actions must cover a common (newly creatable) role ARN; the evaluator should intersect their Resources."

- id: aws-iam-addusertogroup
  provider: aws
  service: iam
  title: Add the source user to an IAM group
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamaddusertogroup
  source_revision: 6bdd8e89e6
  summary: An IAM user that can add itself to a group gains that group's permissions.
  requires:
    all_of:
      - action: iam:AddUserToGroup
        resource: "{target.arn}"
  target:
    kind: aws_group
    selector:
      resource_permission_covers_target: iam:AddUserToGroup
      source_kind: aws_user
    scope: same_account
    aggregate_as: "IAM groups covered by iam:AddUserToGroup in {account}"
  conditions: []
  blockers:
    - scp_or_boundary_deny
  confidence: derived
  severity: critical
  mitigation: Restrict iam:AddUserToGroup to administrators or to specific low-privilege groups.
  references: []
  notes: The Resource of iam:AddUserToGroup is the group ARN. Only IAM users can be group members; role sources cannot use this (they could add some other user they control, covered by user-credential techniques).

- id: aws-iam-updateassumerolepolicy
  provider: aws
  service: iam
  title: Rewrite a role's trust policy to allow the source
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamupdateassumerolepolicy
  source_revision: 6bdd8e89e6
  summary: A principal that can update a role's trust policy can make the role trust itself and assume it.
  requires:
    all_of:
      - action: iam:UpdateAssumeRolePolicy
        resource: "{target.arn}"
  target:
    kind: aws_role
    selector:
      resource_permission_covers_target: iam:UpdateAssumeRolePolicy
    scope: same_account
    aggregate_as: "IAM roles covered by iam:UpdateAssumeRolePolicy in {account}"
  conditions:
    - id: assumerole_grant
      description: If the rewritten trust names the source principal ARN (same account) no identity-policy sts:AssumeRole is needed; if it names only the account root, sts:AssumeRole on the role is also required.
  blockers:
    - scp_or_boundary_deny
  confidence: derived
  severity: critical
  mitigation: Restrict iam:UpdateAssumeRolePolicy to administrators; monitor trust-policy changes.
  references:
    - https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_evaluation-logic-cross-account.html
  notes: Service-linked roles cannot have their trust policy edited and must be excluded from the target set.

- id: aws-iam-updatesamlprovider
  provider: aws
  service: iam
  title: Replace the metadata of a SAML provider trusted by roles
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamupdatesamlprovider-iamlistsamlproviders-iamgetsamlprovider
  source_revision: 6bdd8e89e6
  summary: A principal that can replace a SAML provider's metadata with an IdP it controls can forge assertions and assume every role trusting that provider.
  requires:
    all_of:
      - action: iam:UpdateSAMLProvider
        resource: "{target.saml_provider_arn}"
  target:
    kind: aws_role
    selector:
      trust_allows_saml_provider_covered_by: iam:UpdateSAMLProvider
    scope: same_account
    aggregate_as: "Roles trusting a SAML provider covered by iam:UpdateSAMLProvider in {account}"
  conditions:
    - id: trust_conditions_on_saml_attributes
      description: Trust conditions on SAML attributes (e.g. saml:aud, saml:sub) must be satisfiable; a forged assertion normally can satisfy them.
  blockers:
    - scp_or_boundary_deny
  confidence: derived
  severity: critical
  mitigation: Restrict iam:UpdateSAMLProvider/CreateSAMLProvider to administrators; alert on SAML provider changes.
  references:
    - https://docs.aws.amazon.com/IAM/latest/APIReference/API_UpdateSAMLProvider.html
  notes: "Requires a new placeholder {target.saml_provider_arn}: the SAML provider ARN named in the target role's trust policy. sts:AssumeRoleWithSAML needs no identity permissions."

- id: aws-iam-putuserpermissionsboundary-self
  provider: aws
  service: iam
  title: Replace or remove the permissions boundary of the source user
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamputuserpermissionsboundary
  source_revision: 6bdd8e89e6
  summary: A boundary-restricted IAM user that can change its own permissions boundary can lift the boundary and get the full permissions of its identity policies.
  requires:
    all_of: []
    any_of:
      - - action: iam:PutUserPermissionsBoundary
          resource: "{source.arn}"
      - - action: iam:DeleteUserPermissionsBoundary
          resource: "{source.arn}"
  target:
    kind: aws_account_admin
    selector:
      same_as_source: true
      source_kind: aws_user
    scope: same_account
    aggregate_as: "Administrator of {account} (self-escalation)"
  conditions:
    - id: unbounded_identity_policy_is_admin
      description: Only an escalation if the source currently has a boundary and its identity policies are broader than the boundary; reaching admin requires the identity policies to be admin-equivalent.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Explicitly deny iam:Put/DeleteUserPermissionsBoundary on self inside every permissions boundary.
  references:
    - https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html
  notes: DeleteUserPermissionsBoundary is added as an equivalent alternative (official API); HackTricks documents the Put variant.

- id: aws-iam-putrolepermissionsboundary-self
  provider: aws
  service: iam
  title: Replace or remove the permissions boundary of the source role
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamputrolepermissionsboundary
  source_revision: 6bdd8e89e6
  summary: A boundary-restricted role that can change its own permissions boundary can lift the boundary and get the full permissions of its identity policies.
  requires:
    all_of: []
    any_of:
      - - action: iam:PutRolePermissionsBoundary
          resource: "{source.arn}"
      - - action: iam:DeleteRolePermissionsBoundary
          resource: "{source.arn}"
  target:
    kind: aws_account_admin
    selector:
      same_as_source: true
      source_kind: aws_role
    scope: same_account
    aggregate_as: "Administrator of {account} (self-escalation)"
  conditions:
    - id: unbounded_identity_policy_is_admin
      description: Only an escalation if the source currently has a boundary and its identity policies are broader than the boundary; reaching admin requires the identity policies to be admin-equivalent.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Explicitly deny iam:Put/DeleteRolePermissionsBoundary on self inside every permissions boundary.
  references:
    - https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html
  notes: Changing a boundary of another role the source can assume is the same edge via an assumable role; not modelled separately.
