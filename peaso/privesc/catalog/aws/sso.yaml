# AWS IAM Identity Center (SSO) and Identity Store privilege escalation techniques.
# Source: hacktricks-cloud aws-sso-and-identitystore-privesc/README.md.

- id: aws-sso-directory-updatepassword
  provider: aws
  service: sso
  title: Reset the password of an Identity Center user
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-sso-and-identitystore-privesc/README.md#sso-directoryupdatepassword
  source_revision: a53b46392c
  summary: The source can obtain the privileges of an Identity Center user (and every permission set assigned to it) whose password it can reset.
  requires:
    all_of:
      - action: sso-directory:UpdatePassword
        resource: "*"
  target:
    kind: aws_identity_center_user
    selector:
      any_principal_in_scope: true
    scope: org
    aggregate_as: "Identity Center users in the identity store of {account}"
  conditions:
    - id: identity_store_is_native
      description: Only works for the built-in Identity Center directory; external IdPs (Entra ID, Okta, AD) manage passwords outside AWS.
    - id: target_mfa
      description: Enforced MFA on sign-in blocks use of the reset password.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict sso-directory:* to Identity Center administrators in the management or delegated-admin account and enforce MFA.
  references: []
  notes: sso-directory actions are not resource-scopable; every user of the directory is in scope.

- id: aws-identitystore-creategroupmembership
  provider: aws
  service: sso
  title: Add an Identity Center user controlled by the source to a group
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-sso-and-identitystore-privesc/README.md#identitystorecreategroupmembership
  source_revision: a53b46392c
  summary: The source can obtain the privileges of permission sets assigned to an Identity Center group by adding a user it controls to that group.
  requires:
    all_of:
      - action: identitystore:CreateGroupMembership
        resource: "*"
  target:
    kind: aws_identity_center_permission_set
    selector:
      assigned_to_identity_center_group: true
    scope: org
    aggregate_as: "Permission sets assigned to Identity Center groups"
  conditions:
    - id: controls_identity_center_user
      description: The source must control (be, or know the credentials of) an Identity Center user.
    - id: external_idp_sync
      description: With SCIM provisioning from an external IdP the membership may be overwritten on the next sync.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict identitystore:CreateGroupMembership to administrators and alert on group-membership changes.
  references: []
  notes: identitystore:CreateGroupMembership Resource can be scoped to identity store / group ARNs; the evaluator should apply that scoping when present.

- id: aws-sso-putinlinepolicytopermissionset
  provider: aws
  service: sso
  title: Add an inline policy to a permission set and re-provision it
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-sso-and-identitystore-privesc/README.md#ssoputinlinepolicytopermissionset-ssoprovisionpermissionset
  source_revision: a53b46392c
  summary: The source can obtain admin of every account where a covered permission set it is assigned to is provisioned.
  requires:
    all_of:
      - action: sso:PutInlinePolicyToPermissionSet
        resource: "{target.arn}"
      - action: sso:ProvisionPermissionSet
        resource: "{target.arn}"
  target:
    kind: aws_identity_center_permission_set
    selector:
      resource_permission_covers_target: sso:PutInlinePolicyToPermissionSet
    scope: org
    aggregate_as: "Permission sets covered by sso:PutInlinePolicyToPermissionSet"
  conditions:
    - id: source_assigned_to_permission_set
      description: The source (or an Identity Center user it controls) must be assigned the modified permission set in some account.
    - id: management_account_permission_sets
      description: Permission sets provisioned into the management account can only be edited from the management account, not from a delegated administrator.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict permission-set modification to the management account administrators; use a delegated admin with limited scope.
  references: []
  notes: The sso Resource covers the instance and permission-set ARNs (and account ARNs for provisioning).

