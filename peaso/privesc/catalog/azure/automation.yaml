# catalog_description: Active Azure entries require an identified source principal or intrinsic credential foothold,
# X permission or capability enabling a stated action, and an exact target principal credential, token,
# role/group membership, or additional permissions granted to the caller. Secret/config reads alone
# are excluded unless verified content establishes a usable credential for a named target principal.
# Canonical policy: peaso/privesc/catalog_policy.yaml
# Azure Automation account privilege escalation techniques.
# Source: hacktricks-cloud az-automation-accounts-privesc.md (rev 171e422).
# Placeholder conventions: see catalog/azure/authorization.yaml header.

- id: azure-automation-runbook-author-and-run
  provider: azure
  service: automation
  title: Create or modify a runbook and run it as the Automation account identity
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-automation-accounts-privesc.md#microsoftautomationautomationaccountsjobswrite-microsoftautomationautomationaccountsrunbooksdraftwrite-microsoftautomationautomationaccountsrunbooksdraftcontentwrite-microsoftautomationautomationaccountsjobsoutputread-microsoftautomationautomationaccountsrunbookspublishaction-microsoftresourcessubscriptionsresourcegroupsread-microsoftautomationautomationaccountsrunbookswrite
  source_revision: 171e422
  summary: The source runs arbitrary runbook code inside the Automation account sandbox and obtains tokens for the account's system- and user-assigned managed identities.
  requires:
    all_of: []
    any_of:
      - # edit an existing runbook draft, publish and start it
        - action: Microsoft.Automation/automationAccounts/runbooks/draft/write
          scope: "{target.host_resource}"
        - action: Microsoft.Automation/automationAccounts/runbooks/draft/content/write
          scope: "{target.host_resource}"
        - action: Microsoft.Automation/automationAccounts/runbooks/publish/action
          scope: "{target.host_resource}"
        - action: Microsoft.Automation/automationAccounts/jobs/write
          scope: "{target.host_resource}"
      - # create a new runbook, upload content, publish and start it
        - action: Microsoft.Automation/automationAccounts/runbooks/write
          scope: "{target.host_resource}"
        - action: Microsoft.Automation/automationAccounts/runbooks/draft/content/write
          scope: "{target.host_resource}"
        - action: Microsoft.Automation/automationAccounts/runbooks/publish/action
          scope: "{target.host_resource}"
        - action: Microsoft.Automation/automationAccounts/jobs/write
          scope: "{target.host_resource}"
      - # edit the draft and run it as a test job without publishing
        - action: Microsoft.Automation/automationAccounts/runbooks/draft/write
          scope: "{target.host_resource}"
        - action: Microsoft.Automation/automationAccounts/runbooks/draft/content/write
          scope: "{target.host_resource}"
        - action: Microsoft.Automation/automationAccounts/runbooks/draft/testJob/write
          scope: "{target.host_resource}"
  target:
    kind: azure_managed_identity
    selector:
      attached_to_service: Microsoft.Automation/automationAccounts
    scope: inherited_scope
    aggregate_as: "Managed identities of Automation account {target.host_resource}"
  conditions: []
  blockers:
    - azure_deny_assignment
  confidence: derived
  severity: high
  mitigation: Limit runbook authoring/publish/job permissions (Automation Contributor, Automation Operator + Runbook Operator, Contributor) and give the Automation account identity only the roles its runbooks need.
  references:
    - https://learn.microsoft.com/en-us/azure/automation/automation-role-based-access-control
    - https://learn.microsoft.com/en-us/azure/automation/enable-managed-identity-for-automation
  notes: Reaches only identities attached to the Automation account whose runbook/job permissions the source holds. Output-read permissions are only needed to read results and are not required for the gain. Credential and encrypted-variable assets are modelled separately (azure-automation-runbook-credential-assets); Hybrid Worker VM identities separately (azure-automation-runbook-hybrid-worker).

- id: azure-automation-runbook-hybrid-worker
  provider: azure
  service: automation
  title: Run runbook code on a Hybrid Runbook Worker VM and use the VM's managed identities
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-automation-accounts-privesc.md#hybrid-workers-group
  source_revision: a66f094ede
  summary: Runbook jobs targeted at a Hybrid Worker group execute on the worker machine, so an Azure VM worker's managed identities become reachable through IMDS.
  requires:
    all_of: []
    any_of:
      - - action: Microsoft.Automation/automationAccounts/runbooks/draft/write
          scope: "{pivot}"
        - action: Microsoft.Automation/automationAccounts/runbooks/draft/content/write
          scope: "{pivot}"
        - action: Microsoft.Automation/automationAccounts/runbooks/publish/action
          scope: "{pivot}"
        - action: Microsoft.Automation/automationAccounts/jobs/write
          scope: "{pivot}"
      - - action: Microsoft.Automation/automationAccounts/runbooks/write
          scope: "{pivot}"
        - action: Microsoft.Automation/automationAccounts/runbooks/draft/content/write
          scope: "{pivot}"
        - action: Microsoft.Automation/automationAccounts/runbooks/publish/action
          scope: "{pivot}"
        - action: Microsoft.Automation/automationAccounts/jobs/write
          scope: "{pivot}"
      - - action: Microsoft.Automation/automationAccounts/runbooks/draft/write
          scope: "{pivot}"
        - action: Microsoft.Automation/automationAccounts/runbooks/draft/content/write
          scope: "{pivot}"
        - action: Microsoft.Automation/automationAccounts/runbooks/draft/testJob/write
          scope: "{pivot}"
  pivot_resource_type: Microsoft.Automation/automationAccounts
  target:
    kind: azure_managed_identity
    selector:
      attached_to_service:
        - Microsoft.Compute/virtualMachines
        - Microsoft.HybridCompute/machines
      azure_host_linked_to_pivot: automation_hybrid_worker
    scope: any
    aggregate_as: "Managed identities of Hybrid Worker VMs / Arc machines of Automation account {pivot}"
  conditions:
    - id: worker_is_azure_vm
      description: Only Hybrid Workers that are Azure VMs / Arc machines with managed identities expose cloud identities; on-prem workers yield OS context only.
  blockers: []
  confidence: derived
  severity: high
  mitigation: Restrict runbook authoring on accounts with Hybrid Worker groups and do not attach privileged managed identities to worker VMs.
  references:
    - https://learn.microsoft.com/en-us/azure/automation/automation-hrw-run-runbooks
  notes: Jobs also run as SYSTEM/root on the worker. Arc-enabled server workers expose the Arc machine identity (worker vmResourceId is the Microsoft.HybridCompute/machines id), hence both host types in attached_to_service.

- id: azure-automation-assign-user-assigned-identity
  provider: azure
  service: automation
  title: Attach a user-assigned managed identity to an Automation account and run code as it
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-automation-accounts-privesc.md#microsoftautomationautomationaccountswrite-microsoftmanagedidentityuserassignedidentitiesassignaction
  source_revision: 171e422
  summary: The source attaches any user-assigned identity it can assign to an Automation account it controls and then uses runbook code to obtain that identity's tokens.
  requires:
    all_of:
      - action: Microsoft.ManagedIdentity/userAssignedIdentities/assign/action
        scope: "{target.id}"
      - action: Microsoft.Automation/automationAccounts/write
        scope: "{pivot}"
    any_of:
      - - action: Microsoft.Automation/automationAccounts/runbooks/write
          scope: "{pivot}"
        - action: Microsoft.Automation/automationAccounts/runbooks/draft/content/write
          scope: "{pivot}"
        - action: Microsoft.Automation/automationAccounts/runbooks/publish/action
          scope: "{pivot}"
        - action: Microsoft.Automation/automationAccounts/jobs/write
          scope: "{pivot}"
      - - action: Microsoft.Automation/automationAccounts/runbooks/draft/write
          scope: "{pivot}"
        - action: Microsoft.Automation/automationAccounts/runbooks/draft/content/write
          scope: "{pivot}"
        - action: Microsoft.Automation/automationAccounts/runbooks/publish/action
          scope: "{pivot}"
        - action: Microsoft.Automation/automationAccounts/jobs/write
          scope: "{pivot}"
      - - action: Microsoft.Automation/automationAccounts/runbooks/draft/write
          scope: "{pivot}"
        - action: Microsoft.Automation/automationAccounts/runbooks/draft/content/write
          scope: "{pivot}"
        - action: Microsoft.Automation/automationAccounts/runbooks/draft/testJob/write
          scope: "{pivot}"
  pivot_resource_type: Microsoft.Automation/automationAccounts
  target:
    kind: azure_managed_identity
    selector:
      managed_identity_type: user_assigned
      azure_identity_assignable_in_scope: true
    scope: inherited_scope
    aggregate_as: "User-assigned identities assignable in {scope}"
  conditions: []
  blockers:
    - azure_deny_assignment
  confidence: derived
  severity: high
  mitigation: Restrict Microsoft.ManagedIdentity/userAssignedIdentities/assign/action (Managed Identity Operator, Contributor, Owner) to deployment principals and scope it to individual identities.
  references:
    - https://learn.microsoft.com/en-us/azure/automation/add-user-assigned-identity
  notes: Microsoft.Automation/automationAccounts/write over a resource group also allows creating a new account there (pivot may be newly created).

- id: azure-automation-job-output-credential
  provider: azure
  service: automation
  title: Read tokens and credentials from prior Automation job output
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-automation-accounts-privesc.md#harvest-secrets-from-prior-job-output-and-streams
  source_revision: 658a097d5c
  summary: Read a verified usable credential from historical Automation job output and gain its Entra service principal permissions.
  requires:
    all_of:
    - action: Microsoft.Automation/automationAccounts/jobs/read
      scope: '{pivot}'
    any_of:
    - - action: Microsoft.Automation/automationAccounts/jobs/output/read
        scope: '{pivot}'
    - - action: Microsoft.Automation/automationAccounts/jobs/streams/read
        scope: '{pivot}'
  pivot_resource_type: Microsoft.Automation/automationAccounts
  target:
    kind: azure_service_principal
    selector:
      credential_stored_in_scope: '{pivot}'
    scope: any
    aggregate_as: Verified credential holders in {pivot}
  conditions:
  - id: verified_credential
    description: Only a collected, mapped, still-valid service-principal credential in the readable content creates this edge; uncollected, partial, or unverified content creates no path.
  blockers: []
  confidence: conditional
  severity: high
  mitigation: Remove reusable Entra credentials from the content and restrict the listed read permission.
  references:
  - https://learn.microsoft.com/en-us/azure/automation/manage-runbooks
  notes: Only an exact, usable credential mapped to a named Entra service principal by reviewed azure_privesc_challenge_evidence creates a path; missing or incomplete review creates no path.
