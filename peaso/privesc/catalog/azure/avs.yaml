# catalog_description: An AVS ARM action reaches an adjacent-plane principal only
# when unique reviewed evidence binds the exact private cloud, returned credential
# or successful grant, named subject, usable access, and newly allowed action.
# Canonical policy: peaso/privesc/catalog_policy.yaml
- id: azure-avs-list-vcenter-cloudadmin-external-principal
  provider: azure
  service: avs
  title: Reach the named AVS vCenter CloudAdmin with a verified returned credential
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-vmware-solution-avs-privesc.md#cloudadmin--nsx-t-credential-disclosure-listadmincredentials
  source_revision: 171e422
  summary: Reading AVS administrator credentials can reach the exact vCenter CloudAdmin only when a reviewed login proves that the returned credential grants a new vCenter action.
  requires:
    all_of:
      - action: Microsoft.AVS/privateClouds/listAdminCredentials/action
        scope: '{target.scope}'
  target:
    kind: azure_external_principal
    selector:
      azure_external_principal_evidence: true
      azure_external_plane: vmware_vcenter
    scope: inherited_scope
    outcome: credentials
    aggregate_as: Exact AVS vCenter CloudAdmin reached with reviewed credential
  conditions:
    - id: exact_vcenter_login_and_permission
      description: Unique complete reviewed evidence must bind the returned vCenter username and current password to this private cloud, successful authentication, prior source denial, and a newly allowed named vCenter action.
  blockers:
    - azure_deny_assignment
  confidence: conditional
  severity: high
  mitigation: Restrict listAdminCredentials/action and rotate exposed CloudAdmin credentials.
  references:
    - https://learn.microsoft.com/en-us/azure/azure-vmware/concepts-identity
  notes: The azure_external_principal_evidence record must name the exact vCenter subject and resource; a private-cloud resource proxy or plaintext password alone cannot create an edge.

