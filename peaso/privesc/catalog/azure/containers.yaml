- id: azure-containerapp-create-with-user-assigned-identity
  provider: azure
  service: containers
  title: Create a Container App with a user-assigned identity
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-container-instances-apps-jobs-privesc.md#microsoftappcontainerappswrite-microsoftmanagedidentityuserassignedidentitiesassignaction-microsoftappmanagedenvironmentsjoinaction
  source_revision: 171e422
  summary: The source can obtain the privileges of user-assigned identities assignable in scope.
  requires:
    all_of:
      - action: Microsoft.ManagedIdentity/userAssignedIdentities/assign/action
        scope: '{target.id}'
      - action: Microsoft.App/containerApps/write
        scope: '{pivot}'
      - action: Microsoft.App/managedEnvironments/join/action
        scope: '*'
  pivot_resource_type: Microsoft.Resources/resourceGroups
  target:
    kind: azure_managed_identity
    selector:
      managed_identity_type: user_assigned
      azure_identity_assignable_in_scope: true
    scope: inherited_scope
    aggregate_as: User-assigned identities assignable in {scope}
  conditions:
    - id: environment_available
      description: A joinable managed environment must exist (or managedEnvironments/write to create one).
  blockers:
    - azure_deny_assignment
  confidence: derived
  severity: high
  mitigation: Restrict managedEnvironments/join/action and userAssignedIdentities/assign/action.
  references:
    - https://learn.microsoft.com/en-us/azure/container-apps/managed-identity
  notes: ''

