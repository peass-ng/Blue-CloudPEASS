- id: azure-containerapp-sourcecontrols-write
  provider: azure
  service: containers
  title: Repoint a Container App's GitHub Actions deployment to an attacker repository
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-container-apps-privesc.md#microsoftappcontainerappssourcecontrolswrite--repoint-github-actions-deployment
  source_revision: 658a097d5c
  summary: Rebinding the app's continuous-deployment source can reach its managed identity only after a reviewed attacker-code deployment and token use on that exact app.
  requires:
    all_of:
      - action: Microsoft.App/containerApps/sourcecontrols/write
        scope: "{target.host_resource}"
  target:
    kind: azure_managed_identity
    selector:
      azure_challenge_fact: azure-containerapp-sourcecontrols-write
    scope: inherited_scope
    aggregate_as: "Verified deployed identity of Container App {target.host_resource}"
  conditions:
    - id: exact_source_control_deployment
      description: Reviewed evidence must bind the source and write action to one Container App, its attached managed identity, attacker-controlled repository, successful build and revision deployment, previously denied identity access, and successful token use.
  blockers:
    - azure_deny_assignment
  confidence: conditional
  severity: high
  mitigation: Restrict Microsoft.App/containerApps/sourcecontrols/write (Container Apps Contributor, Contributor) and alert on source-control binding changes.
  references:
    - https://learn.microsoft.com/en-us/azure/container-apps/github-actions
  notes: Uses typed azure_privesc_challenge_evidence validated by azure_deployment_pivots; a sourcecontrols/write grant or generic review flag alone cannot create an identity edge.
