# catalog_description: Active Azure entries require an identified source principal or intrinsic credential foothold,
# X permission or capability enabling a stated action, and an exact target principal credential, token,
# role/group membership, or additional permissions granted to the caller. Secret/config reads alone
# are excluded unless verified content establishes a usable credential for a named target principal.
# Canonical policy: peaso/privesc/catalog_policy.yaml
# Azure DevTest Labs techniques (declarative only).
# Source: hacktricks-cloud az-devtest-labs-privesc.md (rev 171e422).
# A lab VM (Microsoft.DevTestLab/labs/virtualMachines) is backed by a compute VM; the link is not collected,
# so the target uses azure_host_linked_to_pivot (unknown until collected).

- id: azure-devtestlabs-apply-artifacts
  provider: azure
  service: devtest_labs
  title: Apply an artifact to a lab VM to run code in the guest
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-devtest-labs-privesc.md#applyartifacts--in-guest-rce--managed-identity-theft-marquee
  source_revision: 171e422
  summary: Artifacts run as SYSTEM/root in the lab VM, exposing the managed identities of the backing compute VM.
  requires:
    all_of:
      - action: Microsoft.DevTestLab/labs/virtualMachines/ApplyArtifacts/action
        scope: "{pivot}"
  pivot_resource_type: Microsoft.DevTestLab/labs/virtualMachines
  target:
    kind: azure_managed_identity
    selector:
      attached_to_service: Microsoft.Compute/virtualMachines
      azure_host_linked_to_pivot: devtest_lab_compute_vm
    scope: inherited_scope
    aggregate_as: "Managed identities of the compute VM behind lab VM {pivot}"
  conditions:
    - id: artifact_source_available
      description: An artifact source with a script-running artifact (the public repository's Run PowerShell / shell artifacts or a private repo) must be enabled in the lab.
  blockers:
    - azure_deny_assignment
  confidence: conditional
  severity: high
  mitigation: Restrict ApplyArtifacts/action, disable unneeded artifact sources and keep lab VM identities least-privileged.
  references:
    - https://learn.microsoft.com/en-us/azure/devtest-labs/add-artifact-vm
  notes: ""
