# catalog_description: Active Azure entries require an identified source principal or intrinsic credential foothold,
# X permission or capability enabling a stated action, and an exact target principal credential, token,
# role/group membership, or additional permissions granted to the caller. Secret/config reads alone
# are excluded unless verified content establishes a usable credential for a named target principal.
# Canonical policy: peaso/privesc/catalog_policy.yaml
# Azure Function App-specific privilege escalation techniques (declarative only).
# Generic Microsoft.Web/sites techniques are in app_services.yaml and also apply to Function Apps.
# Source: hacktricks-cloud az-functions-app-privesc.md / az-app-services-privesc.md
# (rev 171e422, re-verified).
# Placeholder {target.host_resource.content_storage}: the storage account referenced by the app's
# AzureWebJobsStorage / WEBSITE_CONTENTAZUREFILECONNECTIONSTRING / WEBSITE_RUN_FROM_PACKAGE settings.

- id: azure-functions-hostruntime-vfs-write
  provider: azure
  service: functions
  title: Modify Function App files through the host runtime VFS
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-functions-app-privesc.md#microsoftwebsiteshostruntimevfswrite
  source_revision: 171e422
  summary: The source can obtain the privileges of the Function App's managed identities.
  requires:
    all_of:
      - action: Microsoft.Web/sites/hostruntime/vfs/write
        scope: "{target.host_resource}"
  target:
    kind: azure_managed_identity
    selector:
      attached_to_service: Microsoft.Web/sites
      azure_site_kind: functionapp
    scope: inherited_scope
    aggregate_as: "Managed identities of Function App {target.host_resource}"
  conditions: []
  blockers:
    - azure_deny_assignment
  confidence: derived
  severity: high
  mitigation: Restrict hostruntime/vfs/write.
  references: []
  notes: Not applicable when the app runs from a read-only package.

- id: azure-functions-functions-write
