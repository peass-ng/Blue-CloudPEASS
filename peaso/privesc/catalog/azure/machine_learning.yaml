# catalog_description: Active Azure entries require an identified source principal or intrinsic credential foothold,
# X permission or capability enabling a stated action, and an exact target principal credential, token,
# role/group membership, or additional permissions granted to the caller. Secret/config reads alone
# are excluded unless verified content establishes a usable credential for a named target principal.
# Canonical policy: peaso/privesc/catalog_policy.yaml
# Azure Machine Learning / AI Foundry techniques (declarative only).
# Source: hacktricks-cloud az-ai-foundry-privesc.md and az-machine-learning-privesc.md (rev 171e422).
# {target.host_resource.workspace}: the ML workspace that owns the endpoint/compute.
# pivot_resource_type with '|' means any of the listed resource types.

- id: azure-ml-online-deployment-existing-endpoint
  provider: azure
  service: machine_learning
  title: Deploy code to an existing Azure ML online endpoint
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-ai-foundry-privesc.md#microsoftmachinelearningservicesworkspacesonlineendpointswrite-microsoftmachinelearningservicesworkspacesonlineendpointsdeploymentswrite-microsoftmachinelearningservicesworkspacesread
  source_revision: 171e422
  summary: The source can obtain the privileges of the online endpoint's managed identity.
  requires:
    all_of:
      - action: Microsoft.MachineLearningServices/workspaces/onlineEndpoints/deployments/write
        scope: '{target.host_resource}'
      - action: Microsoft.MachineLearningServices/workspaces/read
        scope: '{target.host_resource.workspace}'
  target:
    kind: azure_managed_identity
    selector:
      attached_to_service: Microsoft.MachineLearningServices/workspaces/onlineEndpoints
    scope: inherited_scope
    aggregate_as: Identity of online endpoint {target.host_resource}
  conditions:
    - id: invoke_path
      description: Triggering the scoring code needs a way to call the endpoint (listKeys, token, or score/action) unless code runs at container start.
  blockers:
    - azure_deny_assignment
  confidence: derived
  severity: high
  mitigation: Restrict deployment write on online endpoints and keep endpoint identities least-privileged.
  references:
    - https://learn.microsoft.com/en-us/azure/machine-learning/how-to-access-resources-from-endpoints-managed-identities
  notes: Endpoint identity is fixed at creation; workspace identity roles do not apply.

- id: azure-ml-online-endpoint-create-with-user-assigned-identity
  provider: azure
  service: machine_learning
  title: Create an Azure ML online endpoint with a user-assigned identity
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-ai-foundry-privesc.md#microsoftmachinelearningservicesworkspacesonlineendpointswrite-microsoftmachinelearningservicesworkspacesonlineendpointsdeploymentswrite-microsoftmachinelearningservicesworkspacesread
  source_revision: 171e422
  summary: The source can obtain the privileges of user-assigned identities assignable in scope.
  requires:
    all_of:
      - action: Microsoft.ManagedIdentity/userAssignedIdentities/assign/action
        scope: '{target.id}'
      - action: Microsoft.MachineLearningServices/workspaces/onlineEndpoints/write
        scope: '{pivot}'
      - action: Microsoft.MachineLearningServices/workspaces/onlineEndpoints/deployments/write
        scope: '{pivot}'
      - action: Microsoft.MachineLearningServices/workspaces/read
        scope: '{pivot}'
  pivot_resource_type: Microsoft.MachineLearningServices/workspaces
  target:
    kind: azure_managed_identity
    selector:
      managed_identity_type: user_assigned
      azure_identity_assignable_in_scope: true
    scope: inherited_scope
    aggregate_as: User-assigned identities assignable in {scope}
  conditions:
    - id: invoke_path
      description: Triggering the scoring code needs a way to call the endpoint unless code runs at container start.
  blockers:
    - azure_deny_assignment
  confidence: derived
  severity: high
  mitigation: Restrict userAssignedIdentities/assign/action and online endpoint creation.
  references:
    - https://learn.microsoft.com/en-us/azure/machine-learning/how-to-access-resources-from-endpoints-managed-identities
  notes: ''

- id: azure-ml-compute-create-with-user-assigned-identity
  provider: azure
  service: machine_learning
  title: Create an Azure ML compute instance with a user-assigned identity
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-ai-foundry-privesc.md#microsoftmachinelearningservicesworkspacescomputeswrite
  source_revision: 171e422
  summary: The source can obtain the privileges of user-assigned identities assignable in scope.
  requires:
    all_of:
      - action: Microsoft.ManagedIdentity/userAssignedIdentities/assign/action
        scope: '{target.id}'
      - action: Microsoft.MachineLearningServices/workspaces/computes/write
        scope: '{pivot}'
  pivot_resource_type: Microsoft.MachineLearningServices/workspaces
  target:
    kind: azure_managed_identity
    selector:
      managed_identity_type: user_assigned
      azure_identity_assignable_in_scope: true
    scope: inherited_scope
    aggregate_as: User-assigned identities assignable in {scope}
  conditions:
    - id: compute_access_path
      description: The source needs a path into the instance (SSH if network allows, setup script, or application access).
  blockers:
    - azure_deny_assignment
  confidence: derived
  severity: high
  mitigation: Restrict computes/write and userAssignedIdentities/assign/action; disable public SSH on compute instances.
  references:
    - https://learn.microsoft.com/en-us/azure/machine-learning/how-to-create-compute-instance
  notes: ''

- id: azure-ml-compute-application-access
  provider: azure
  service: machine_learning
  title: Open Jupyter on a compute instance assigned to the source
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-ai-foundry-privesc.md#microsoftmachinelearningservicesworkspacesread--microsoftmachinelearningservicesworkspacescomputesapplicationaccessaction
  source_revision: 171e422
  summary: The source can obtain the privileges of the managed identities of a compute instance assigned to the source.
  requires:
    all_of:
      - action: Microsoft.MachineLearningServices/workspaces/read
        scope: '{target.host_resource.workspace}'
      - action: Microsoft.MachineLearningServices/workspaces/computes/applicationaccess/action
        scope: '{target.host_resource}'
  target:
    kind: azure_managed_identity
    selector:
      attached_to_service: Microsoft.MachineLearningServices/workspaces/computes
      ml_compute_assigned_to_source: true
    scope: inherited_scope
    aggregate_as: Identities of ML compute {target.host_resource}
  conditions:
    - id: instance_running
      description: The instance must be running (start is a separate permission).
    - id: network_reachable
      description: The source must reach the instance application endpoints.
  blockers: []
  confidence: conditional
  severity: high
  mitigation: Keep compute-instance identities least-privileged; they are usable by the assigned user.
  references: []
  notes: Does not open another user's instance.
