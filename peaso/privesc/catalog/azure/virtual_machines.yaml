# Azure Virtual Machines privilege escalation techniques.
# Source: hacktricks-cloud az-virtual-machines-and-network-privesc.md (rev a53b46392c).
# Placeholder conventions: see catalog/azure/authorization.yaml header.
# All in-guest code execution reaches the identities exposed by IMDS: the VM's system-assigned
# identity and every user-assigned identity attached to it.

- id: azure-vm-extensions-write
  provider: azure
  service: virtual_machines
  title: Deploy or update a VM extension to run code in the guest
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-virtual-machines-and-network-privesc.md#microsoftcomputevirtualmachinesextensionswrite
  source_revision: a53b46392c
  summary: Custom Script, DSC, VMAccess, Hybrid Worker or third-party (Salt, Chef) extensions give root/SYSTEM code execution in the VM and thus tokens of its managed identities.
  requires:
    all_of:
      - action: Microsoft.Compute/virtualMachines/extensions/write
        scope: "{target.host_resource}"
  target:
    kind: azure_managed_identity
    selector:
      attached_to_service: Microsoft.Compute/virtualMachines
    scope: inherited_scope
    aggregate_as: "Managed identities of VM {target.host_resource}"
  conditions:
    - id: vm_agent_running
      description: The VM must be running with a healthy VM agent to process the extension.
  blockers:
    - azure_deny_assignment
  confidence: derived
  severity: high
  mitigation: Restrict Microsoft.Compute/virtualMachines/extensions/write (Virtual Machine Contributor, Contributor), use Azure Policy to allow-list extension publishers/types, and keep VM identities least-privileged.
  references:
    - https://learn.microsoft.com/en-us/azure/virtual-machines/extensions/features-windows
  notes: Covers the VMAccess password/SSH-key reset (which additionally uses virtualMachines/read+write in the CLI flow) and the DSC extension flow. Scale-set extension equivalents (virtualMachineScaleSets/extensions/write) are not on this page.

