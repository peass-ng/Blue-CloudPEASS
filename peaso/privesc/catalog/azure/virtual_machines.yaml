- id: azure-vmss-vm-managed-runcommands-write
  provider: azure
  service: virtual_machines
  title: Create a managed Run Command on a scale-set instance
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-virtual-machines-and-network-privesc.md#microsoftcomputevirtualmachinesruncommandswrite
  source_revision: a53b46392c
  summary: Managed Run Command on a VMSS instance runs as root/SYSTEM and exposes the scale set's managed identities.
  requires:
    all_of:
      - action: Microsoft.Compute/virtualMachineScaleSets/virtualMachines/runCommands/write
        scope: "{target.host_resource}"
  target:
    kind: azure_managed_identity
    selector:
      attached_to_service: Microsoft.Compute/virtualMachineScaleSets
    scope: inherited_scope
    aggregate_as: "Managed identities of scale set {target.host_resource}"
  conditions:
    - id: vm_agent_running
      description: Instance must be running with a healthy VM agent (Uniform orchestration instances).
  blockers:
    - azure_deny_assignment
