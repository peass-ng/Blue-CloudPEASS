# A row-policy GRANT TO automatically gives the named principal the system-managed
# filteredDataViewer role. A path requires typed reviewed before/after evidence
# for an exact table and the acting principal; the DDL permission alone is not
# proof that the caller was granted access.
# Canonical policy: peaso/privesc/catalog_policy.yaml
- id: gcp-bigquery-row-policy-create-self-grant
  provider: gcp
  service: bigquery
  title: Self-grant filtered row access by creating a row access policy
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-bigquery-privesc.md#bigqueryrowaccesspoliciescreateupdate--self-grant-filtered-row-access
  source_revision: f0f683242a
  summary: The source creates a row access policy on an exact table with itself in GRANT TO, which automatically grants the system-managed filteredDataViewer role and its bigquery.rowAccessPolicies.getFilteredData permission on that table.
  requires:
    all_of:
    - action: bigquery.rowAccessPolicies.create
      resource: '{target.policy_resource}'
    - action: bigquery.rowAccessPolicies.setIamPolicy
      resource: '{target.policy_resource}'
    - action: bigquery.tables.getData
      resource: '{target.policy_resource}'
    - action: bigquery.jobs.create
      resource: '{target.scope}'
  target:
    kind: gcp_verified_authority
    selector:
      gcp_resource_self_grant: true
    scope: same_project
    outcome: permission_grant
    grants:
    - bigquery.rowAccessPolicies.getFilteredData
    aggregate_as: Verified row-policy self-grant on an exact table
  conditions:
  - id: exact_reviewed_row_policy_grant
    description: Requires complete, unique evidence binding the exact table, source principal as policy grantee, prior absence, accepted CREATE ROW ACCESS POLICY DDL, and effective filteredDataViewer permission after the mutation.
  blockers:
  - gcp_deny_policy
  confidence: conditional
  severity: high
  mitigation: Restrict row access policy creation on sensitive tables and review policy grantees and filters.
  notes: The gcp_resource_self_grant_evidence record must name the exact table in both TargetResource and GrantedResource, the source as GrantedPrincipalId, AccessPermission bigquery.rowAccessPolicies.create, and GrantedPermissions exactly bigquery.rowAccessPolicies.getFilteredData. The CREATE action alone never creates a graph path.
