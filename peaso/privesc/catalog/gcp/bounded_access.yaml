- id: gcp-bigquery-authorized-dataset-existing-view-bounded-table-access
  provider: gcp
  service: bigquery
  title: Gain bounded protected-table access through one existing view in an authorized dataset
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-bigquery-privesc.md#dataset-acl-write--authorized-view-or-dataset-as-an-indirect-read-path
  source_revision: 9867ed370e
  summary: The source adds an exact dataset access entry with targetTypes VIEWS to a protected source dataset, then queries one already existing view in the authorized dataset that reaches a protected table the source could not previously read.
  requires:
    all_of:
    - action: bigquery.datasets.getIamPolicy
      resource: '*'
    - action: bigquery.datasets.setIamPolicy
      resource: '*'
    - action: bigquery.tables.getData
      resource: '*'
    - action: bigquery.jobs.create
      resource: '*'
  target:
    kind: gcp_verified_authority
    selector:
      gcp_bounded_access_gain: true
      gcp_bounded_mechanism: bigquery_authorized_dataset
    scope: any
    outcome: bounded_authority
    grants:
    - bigquery.tables.getData
    aggregate_as: Indirect protected-table access through one existing authorized-dataset view
  conditions:
  - id: exact_existing_view_and_authorized_dataset_proof
    description: Complete reviewed evidence must bind the protected dataset ACL entry naming the exact view dataset with targetTypes VIEWS, a preexisting accessible view inside it, one referenced protected table, prior source denial, and a later allowed query through that same view.
  blockers: []
  confidence: conditional
  severity: high
  mitigation: Restrict protected-dataset ACL writes and review dataset authorization entries and the existing views they cover.
  notes: This covers one preexisting view only. It does not infer the ability to create or edit views in the authorized dataset, which requires separate source-table permissions. The grant labels indirect bounded access, never direct table IAM.
