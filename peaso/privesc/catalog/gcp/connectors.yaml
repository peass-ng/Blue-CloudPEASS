# GCP Integration Connectors privilege escalation techniques.
# Source: hacktricks-cloud gcp-privilege-escalation/gcp-integration-connectors-privesc.md (rev a53b46392c).
# Placeholder / selector conventions: see the header of catalog/gcp/iam.yaml.
# attached_to_service: connectors_agent_impersonable -> SAs on which the project's Connectors service agent
# (service-<number>@gcp-sa-connectors) can mint tokens (Token Creator, incl. cross-project grants to that agent).
# attached_to_service: integration_connector -> runtime SA bound to an existing connection ("{target.host_resource}").

- id: gcp-connectors-connections-create-delegated-sa
  provider: gcp
  service: connectors
  title: Create or update a connection that authenticates as an SA delegated to the Connectors service agent
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-integration-connectors-privesc.md#connectorsconnectionscreate--connectorsconnectionsupdate--execute-as-a-service-account-already-delegated-to-the-connectors-service-agent
  source_revision: a53b46392c
  summary: The source can obtain the privileges of service accounts that the Connectors service agent of a project where it holds connectors.connections.create or update can impersonate.
  requires:
    any_of:
      - - action: connectors.connections.create
          resource: "*"
      - - action: connectors.connections.update
          resource: "*"
  target:
    kind: gcp_service_account
    selector:
      attached_to_service: connectors_agent_impersonable
    scope: any
    aggregate_as: "SAs the Connectors service agent of {project} can impersonate"
  conditions:
    - id: invocation
      description: The connection must be used by an existing integration or invoked by the source (integrations.integrationVersions.invoke).
    - id: request_level
      description: The SA identity is used for requests the connection sends (OAuth or ID token), not handed to the source as a token.
    - id: agent_delegation
      description: Requires an existing Token Creator grant from the target SA to the Connectors service agent; no actAs is checked on the caller.
  blockers:
    - gcp_deny_policy
    - vpc_sc_perimeter
  confidence: conditional
  severity: high
  mitigation: Do not grant the Connectors service agent Token Creator on privileged SAs and restrict roles/connectors.editor.

- id: gcp-connectors-connections-setiampolicy
  provider: gcp
  service: connectors
  title: Self-grant use of a connection through its IAM policy
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-integration-connectors-privesc.md#connectorsconnectionssetiampolicy--resource-level-self-grant-to-use-a-connection
  source_revision: a53b46392c
  summary: The source can obtain the privileges of the runtime service accounts bound to connections whose IAM policy it controls.
  requires:
    all_of:
      - action: connectors.connections.setIamPolicy
        resource: "{target.host_resource}"
  target:
    kind: gcp_service_account
    selector:
      attached_to_service: integration_connector
    scope: any
    aggregate_as: "Runtime SAs of connections whose IAM the source controls"
  conditions:
    - id: request_level
      description: The identity is used only through connector actions against the connection's backend.
  blockers:
    - gcp_deny_policy
  confidence: conditional
  severity: medium
  mitigation: Restrict connectors.connections.setIamPolicy (roles/connectors.admin).
  notes: The stored external credentials of the connection are also usable, which is not a GCP identity.
