# GCP Dataform privilege escalation techniques (run-as service account limited to BigQuery jobs).
# Source: hacktricks-cloud gcp-privilege-escalation/gcp-dataform-privesc.md (rev a53b46392c).
# Placeholder / selector conventions: see the header of catalog/gcp/iam.yaml.
# Google enforces "strict act-as mode" on all repositories: the caller needs iam.serviceAccounts.actAs on the effective
# service account for repository serviceAccount changes, manual workflow invocations, workflow configs and release configs.
# Scheduled runs are started by the Dataform service agent, which must hold Token Creator (and Service Account User) on
# the effective SA. Compilation runs in Google's environment; only the resulting BigQuery jobs run as the SA.

- id: gcp-dataform-workflow-invocation-actas
  provider: gcp
  service: dataform
  title: Run a Dataform workflow invocation as a chosen service account
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-dataform-privesc.md#dataformrepositoriescreate--dataformrepositoriesupdate--iamserviceaccountsactas
  source_revision: a53b46392c
  summary: The source can obtain the BigQuery privileges of any service account in the project on which it holds iam.serviceAccounts.actAs.
  requires:
    all_of:
      - action: iam.serviceAccounts.actAs
        resource: "{target.email}"
    any_of:
      - - action: dataform.repositories.create
          resource: "*"
      - - action: dataform.repositories.setIamPolicy
          resource: "*"
      - - action: dataform.workspaces.create
          resource: "*"
        - action: dataform.workspaces.writeFile
          resource: "*"
        - action: dataform.compilationResults.create
          resource: "*"
        - action: dataform.workflowInvocations.create
          resource: "*"
      - - action: dataform.repositories.commit
          resource: "*"
        - action: dataform.compilationResults.create
          resource: "*"
        - action: dataform.workflowInvocations.create
          resource: "*"
  target:
    kind: gcp_service_account
    selector:
      gcp_actas_granted_on_target: true
      gcp_sa_in_scope_of_permission: true
    scope: same_project
    aggregate_as: "Service accounts usable as Dataform workflow identity in {project}"
  conditions:
    - id: service_agent_token_creator
      description: The Dataform service agent (service-<number>@gcp-sa-dataform) must hold Token Creator on the target SA, otherwise invocations fail.
    - id: create_self_admin
      description: repositories.create alone suffices because the creator can be granted roles/dataform.admin on the new repository at creation; repositories.setIamPolicy self-grants the same on an existing repository.
    - id: bigquery_only
      description: The SA identity is used only for BigQuery jobs (queries, DDL/DML, EXPORT DATA), not handed to the source as a general token.
  blockers:
    - gcp_deny_policy
    - vpc_sc_perimeter
  confidence: conditional
  severity: high
  mitigation: Grant actAs only on dedicated Dataform SAs, do not grant the Dataform service agent Token Creator on privileged SAs, and restrict roles/dataform.admin and roles/dataform.editor.
  references:
    - https://docs.cloud.google.com/dataform/docs/strict-act-as-mode
    - https://docs.cloud.google.com/dataform/docs/required-access
  notes: Covers the repository serviceAccount, per-invocation invocationConfig.serviceAccount, repo setIamPolicy and direct-commit variants. HackTricks states running as a repository's pinned SA needs no caller actAs; Google's strict act-as mode (enforced for all repositories) requires actAs on the effective SA for manual invocations, so actAs is required here.

- id: gcp-dataform-scheduled-workflow-code-tamper
  provider: gcp
  service: dataform
  title: Change the code an existing scheduled Dataform workflow compiles from
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-dataform-privesc.md#dataformrepositoriescommit--direct-code-injection-onto-the-default-branch-no-workspace
  source_revision: a53b46392c
  summary: The source can obtain the BigQuery privileges of the service account of scheduled workflow configs of every Dataform repository whose default-branch code or git remote it can change.
  requires:
    any_of:
      - - action: dataform.repositories.commit
          resource: "{target.host_resource}"
      - - action: dataform.repositories.update
          resource: "{target.host_resource}"
      - - action: dataform.workspaces.writeFile
          resource: "{target.host_resource}"
        - action: dataform.workspaces.commit
          resource: "{target.host_resource}"
        - action: dataform.workspaces.push
          resource: "{target.host_resource}"
  target:
    kind: gcp_service_account
    selector:
      attached_to_service: dataform_repository
    scope: same_project
    aggregate_as: "SAs of scheduled Dataform workflows whose repository code the source can change"
  conditions:
    - id: scheduled_workflow
      description: The repository must have a release config compiling from the default branch and a scheduled workflow config; the next scheduled run (started by the Dataform service agent) executes the changed code as the effective SA.
    - id: git_remote_update
      description: The repositories.update path repoints gitRemoteSettings to source-controlled git; whether strict act-as re-checks actAs on update of a repository with a serviceAccount set is not stated.
    - id: bigquery_only
      description: The SA identity is used only for BigQuery jobs.
  blockers:
    - gcp_deny_policy
  confidence: conditional
  severity: medium
  mitigation: Restrict dataform.repositories.commit/update and workspace commit/push on repositories with scheduled workflows, and protect the connected git default branch.
  references:
    - https://docs.cloud.google.com/dataform/docs/workflow-configurations
  notes: Creating new release/workflow configs needs caller actAs under strict act-as mode and is covered by gcp-dataform-workflow-invocation-actas.
