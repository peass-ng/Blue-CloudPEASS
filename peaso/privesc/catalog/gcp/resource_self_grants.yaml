# GCP resource IAM self-grants. Each entry requires a concrete policy-write action and typed reviewed evidence of a new effective permission to the same source principal on an exact resource governed by the policy. A policy write alone, or a mere data read, never creates a path.
# Canonical policy: peaso/privesc/catalog_policy.yaml
- id: gcp-connectors-connections-setiampolicy-connection-self-grant
  provider: gcp
  service: connectors
  title: Self-grant connectors.connections.executeSqlQuery on a connection
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-integration-connectors-privesc.md#connectorsconnectionssetiampolicy--resource-level-self-grant-to-use-a-connection
  source_revision: a1de13ac34
  summary: The source uses connectors.connections.setIamPolicy on an exact connection to add its own IAM binding and gain
    connectors.connections.executeSqlQuery, which it lacked before the accepted policy mutation.
  requires:
    all_of:
    - action: connectors.connections.setIamPolicy
      resource: '{target.policy_resource}'
  target:
    kind: gcp_verified_authority
    selector:
      gcp_resource_self_grant: true
    scope: any
    outcome: permission_grant
    grants:
    - connectors.connections.executeSqlQuery
    aggregate_as: Verified connection self-grant to the source
  conditions:
  - id: exact_reviewed_self_grant
    description: Requires complete, unique, source-bound evidence for the exact policy and granted resources, policy-write action, new permission,
      prior absence, accepted IAM mutation, and effective post-grant access.
  blockers:
  - gcp_deny_policy
  confidence: conditional
  severity: high
  mitigation: Restrict connectors.connections.setIamPolicy on protected connection resources and review self-directed IAM
    policy changes.
  notes: The policy write alone does not create a path. The gcp_resource_self_grant_evidence record must prove this exact
    permission gain for the acting principal on GrantedResource.
