# GCP Cloud Source Repositories privilege escalation techniques (legacy service, unavailable to new customers).
# Source: hacktricks-cloud gcp-privilege-escalation/gcp-sourcerepos-privesc.md (rev a53b46392c).
# Placeholder / selector conventions: see the header of catalog/gcp/iam.yaml (attached_to_service sourcerepo_trigger_consumer
# as defined in securesourcemanager.yaml).

- id: gcp-sourcerepos-update-build-trigger
  provider: gcp
  service: source
  title: Push code to a Cloud Source repository that feeds a Cloud Build trigger
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-sourcerepos-privesc.md#sourcereposupdate
  source_revision: a53b46392c
  summary: The source can obtain the privileges of the build service accounts of triggers that build from Cloud Source repositories on which it holds source.repos.update.
  requires:
    all_of:
      - action: source.repos.update
        resource: "{target.artifact_arn}"
  target:
    kind: gcp_service_account
    selector:
      attached_to_service: sourcerepo_trigger_consumer
    scope: any
    aggregate_as: "Build SAs of triggers on writable Cloud Source repositories"
  conditions:
    - id: trigger
      description: A Cloud Build trigger must build the pushed branch/tag using repository-controlled build config.
  blockers:
    - gcp_deny_policy
  confidence: conditional
  severity: high
  mitigation: Restrict source.repos.update (roles/source.writer, roles/editor) on repositories with build triggers and require approval on triggers.

- id: gcp-sourcerepos-setiampolicy
  provider: gcp
  service: source
  title: Self-grant source.admin on a repository through its IAM policy
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-sourcerepos-privesc.md#sourcerepossetiampolicy
  source_revision: a53b46392c
  summary: The source can obtain the privileges of the build service accounts of triggers that build from Cloud Source repositories whose IAM policy it controls.
  requires:
    all_of:
      - action: source.repos.setIamPolicy
        resource: "{target.artifact_arn}"
  target:
    kind: gcp_service_account
    selector:
      attached_to_service: sourcerepo_trigger_consumer
    scope: any
    aggregate_as: "Build SAs of triggers on Cloud Source repositories whose IAM the source controls"
  conditions:
    - id: followup_push
      description: The self-granted role is then used as in gcp-sourcerepos-update-build-trigger.
  blockers:
    - gcp_deny_policy
  confidence: conditional
  severity: high
  mitigation: Restrict source.repos.setIamPolicy (roles/source.admin, roles/owner).
