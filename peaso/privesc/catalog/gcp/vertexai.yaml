- id: gcp-vertex-customjob-custom-code-agent
  provider: gcp
  service: aiplatform
  title: Run a Vertex AI job with no service account so it runs as the Custom Code Service Agent
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-vertex-ai-privesc.md#no-serviceaccount-job--custom-code-service-agent-run-as-with-no-actas
  source_revision: a53b46392c
  summary: The source can obtain the privileges of the Vertex AI Custom Code Service Agent of every project where it can create custom or pipeline
    jobs.
  requires:
    any_of:
    - - action: aiplatform.customJobs.create
        resource: '*'
    - - action: aiplatform.pipelineJobs.create
        resource: '*'
  target:
    kind: gcp_service_account
    selector:
      attached_to_service: vertex_custom_code_agent
      gcp_sa_in_scope_of_permission: true
    scope: same_project
    aggregate_as: Vertex AI Custom Code Service Agent of {project}
  conditions:
  - id: agent_roles
    description: Power equals the agent's current bindings (roles/aiplatform.customCodeServiceAgent by default, which HackTricks reports as including
      token minting for project SAs and broad storage/BigQuery access).
  - id: agent_node
    description: The agent may not be a collected SA node; the evaluator needs a synthetic node per project.
  blockers:
  - gcp_deny_policy
  - vpc_sc_perimeter
  confidence: conditional
  severity: critical
  mitigation: Review the bindings of service-<number>@gcp-sa-aiplatform-cc and restrict aiplatform.customJobs.create / pipelineJobs.create (roles/aiplatform.user).
  notes: No actAs is checked when no service account is pinned (HackTricks).

- id: gcp-vertex-workbench-instance-update-or-setiampolicy
  provider: gcp
  service: notebooks
  title: Take over an existing Workbench instance through update/reset or an instance IAM self-grant
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-vertex-ai-privesc.md#aiplatformnotebookexecutionjobscreate-iamserviceaccountsactas
  source_revision: a53b46392c
  summary: The source can obtain the privileges of the service accounts attached to existing Workbench instances it can update and reset or whose
    IAM policy it controls.
  requires:
    any_of:
    - - action: notebooks.instances.update
        resource: '{target.host_resource}'
      - action: notebooks.instances.reset
        resource: '{target.host_resource}'
    - - action: notebooks.instances.setIamPolicy
        resource: '{target.host_resource}'
  target:
    kind: gcp_service_account
    selector:
      attached_to_service: notebooks_instance
    scope: same_project
    aggregate_as: SAs of Workbench instances the source can take over
  conditions:
  - id: followup_access
    description: After an IAM self-grant the source still needs instance access (JupyterLab/proxy) or update+reset.
  - id: instance_owners
    description: If instance-owners is unset, any principal with serviceAccountUser on the instance SA can open it.
  blockers:
  - gcp_deny_policy
  confidence: conditional
  severity: high
  mitigation: Restrict notebooks.instances.update/reset/setIamPolicy (roles/notebooks.admin, roles/editor) on instances with privileged SAs and
    set instance-owners explicitly.
