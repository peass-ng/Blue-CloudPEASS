# GCP Vertex AI (aiplatform) and Workbench (notebooks) privilege escalation techniques.
# Source: hacktricks-cloud gcp-privilege-escalation/gcp-vertex-ai-privesc.md (rev a53b46392c).
# Placeholder / selector conventions: see the header of catalog/gcp/iam.yaml.
# attached_to_service: vertex_custom_code_agent -> service-<number>@gcp-sa-aiplatform-cc of the project;
# notebooks_instance -> SA attached to an existing Workbench instance ("{target.host_resource}").

- id: gcp-vertex-customjobs-create-actas
  provider: gcp
  service: aiplatform
  title: Create a Vertex AI custom job running as a chosen service account
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-vertex-ai-privesc.md#aiplatformcustomjobscreate-iamserviceaccountsactas
  source_revision: a53b46392c
  summary: The source can obtain the privileges of any service account in the project on which it holds iam.serviceAccounts.actAs.
  requires:
    all_of:
    - action: aiplatform.customJobs.create
      resource: '*'
    - action: iam.serviceAccounts.actAs
      resource: '{target.email}'
  target:
    kind: gcp_service_account
    selector:
      gcp_actas_granted_on_target: true
      gcp_sa_in_scope_of_permission: true
    scope: same_project
    aggregate_as: Service accounts usable as Vertex AI workload SA in {project}
  conditions:
  - id: metadata_reachable
    description: The workload code must be able to use the attached identity (metadata server or default credentials in the runtime).
  blockers:
  - gcp_deny_policy
  - vpc_sc_perimeter
  confidence: derived
  severity: critical
  mitigation: Grant actAs only on dedicated Vertex AI workload SAs; no aiplatform.* role contains actAs but roles/editor contains both.
  notes: aiplatform.trainingPipelines.create wrapping a custom job spec is the same class.

