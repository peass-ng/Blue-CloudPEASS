  technique: ValidatingWebhookConfiguration create/update/patch
  reason: A validating webhook can only admit/deny and observe objects (data disclosure, policy bypass); identity gain is through mutating webhooks, which are modelled.
- source: src/pentesting-cloud/kubernetes-security/abusing-roles-clusterroles-in-kubernetes/README.md#services-status-cve-2020-8554
  technique: services/status LoadBalancer IP spoofing (CVE-2020-8554)
