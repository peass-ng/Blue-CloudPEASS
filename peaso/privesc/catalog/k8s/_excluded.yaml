- source: src/pentesting-cloud/kubernetes-security/abusing-roles-clusterroles-in-kubernetes/README.md#access-any-resource-with-a-specific-verb
  technique: Single verb on all resources (e.g. get * or create *)
  reason: Not a distinct permission set; the evaluator's wildcard expansion matches the specific entries (secrets read, pods create, serviceaccounts/token create...).
