  technique: pods/status and nodes/status label/readiness/IP spoofing; pods/binding and bindings create
  reason: Traffic, policy-selector and scheduling manipulation; pods/binding only places an existing unscheduled pod. Identity gain only when combined with node control, modelled in k8s-nodes-replacement-pod-to-controlled-node.
- source: src/pentesting-cloud/kubernetes-security/abusing-roles-clusterroles-in-kubernetes/README.md#legacy-status-metadata-and-controller-deputies
