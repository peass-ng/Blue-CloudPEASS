# Kubernetes RBAC-plane privilege-escalation techniques (secrets, tokens, impersonation,
# bind/escalate, CSR). Source: hacktricks-cloud rev a53b46392c.
#
# Conventions used across catalog/k8s/*.yaml (see SCHEMA EXTENSIONS in the agent report):
#   namespace: "{target.namespace}"  -> the effective grant (RoleBinding in that namespace, or a
#                                       ClusterRoleBinding) must cover the namespace of the target.
#   namespace: "{pivot.namespace}"   -> one namespace P in which EVERY requirement using
#                                       {pivot.namespace} holds at the same time; blockers and selectors
#                                       that mention the pivot are evaluated against P.
#   namespace: "*"                   -> cluster-wide grant (ClusterRoleBinding) or cluster-scoped resource.
#   resource_name: <name>            -> the rule must cover that object name (no resourceNames, or the
#                                       name is listed). {target.name} = name of the target object.
#   api_group omitted                -> core group "".
#   source_kind (top level)          -> the source is an identity of that kind rather than any RBAC
#                                       subject holding the listed permissions (requires may be empty).

- id: k8s-rbac-wildcard-cluster-admin
  provider: k8s
  service: rbac
  title: Wildcard verbs on wildcard resources cluster-wide
  source: src/pentesting-cloud/kubernetes-security/abusing-roles-clusterroles-in-kubernetes/README.md#access-any-resource-or-verb-wildcard
  source_revision: a53b46392c
  summary: The source can obtain the privileges of cluster-admin (full control of every API resource in the cluster).
  requires:
    all_of:
      - verb: "*"
        resource: "*"
        api_group: "*"
        namespace: "*"
  target:
    kind: k8s_cluster_admin
    selector:
      any_principal_in_scope: true
    scope: cluster
    aggregate_as: "cluster-admin of {cluster}"
  conditions: []
  blockers: []
  confidence: derived
  severity: critical
  mitigation: Bind cluster-admin or wildcard ClusterRoles only to break-glass identities; replace wildcards with explicit verbs, resources and API groups.
  references:
    - https://kubernetes.io/docs/concepts/security/rbac-good-practices/
  notes: A namespaced wildcard (Role or RoleBinding to a wildcard ClusterRole) is not modelled separately; the evaluator's wildcard expansion makes it match the per-permission entries (pods create, secrets read, serviceaccounts/token, rolebindings + bind) scoped to that namespace.

- id: k8s-rbac-secrets-read-legacy-sa-token
  provider: k8s
  service: rbac
  title: Read Secrets containing legacy ServiceAccount tokens
  source: src/pentesting-cloud/kubernetes-security/abusing-roles-clusterroles-in-kubernetes/README.md#listing-secrets
  source_revision: a53b46392c
  summary: The source can obtain the privileges of ServiceAccounts in the namespace that have a kubernetes.io/service-account-token Secret.
  requires:
    all_of: []
    any_of:
      - - verb: get
          resource: secrets
          namespace: "{target.namespace}"
      - - verb: list
          resource: secrets
          namespace: "{target.namespace}"
      - - verb: watch
          resource: secrets
          namespace: "{target.namespace}"
  target:
    kind: k8s_service_account
    selector:
      k8s_sa_in_namespace: "{target.namespace}"
    scope: same_namespace
    aggregate_as: "ServiceAccounts with legacy token Secrets in {target.namespace}"
  conditions:
    - id: legacy_sa_token_secret_exists
      description: Only ServiceAccounts that have a kubernetes.io/service-account-token Secret are reachable. Secrets are not collected, so existence is unknown; clusters >=1.24 no longer auto-create them and LegacyServiceAccountTokenCleanUp may have removed unused ones, but manually created token Secrets remain.
    - id: get_requires_secret_name
      description: With get alone (no list/watch) the Secret name must be known or discoverable (e.g. referenced in the ServiceAccount's secrets field or a workload spec).
  blockers: []
  confidence: derived
  severity: critical
  mitigation: Remove get/list/watch on secrets from non-admin subjects, delete legacy service-account-token Secrets and rely on bound projected tokens.
  references:
    - https://kubernetes.io/docs/concepts/security/service-accounts/
    - https://kubernetes.io/docs/reference/access-authn-authz/service-accounts-admin/#legacy-serviceaccount-token-cleaner
  notes: Reading other Secret types (cloud keys, kubeconfigs) can also yield identities, but those targets are not derivable from the snapshot and are excluded. list and watch return Secret data, not only names.

- id: k8s-rbac-secrets-create-sa-token-secret
  provider: k8s
  service: rbac
  title: Create a ServiceAccount token Secret and read it back
  source: src/pentesting-cloud/kubernetes-security/abusing-roles-clusterroles-in-kubernetes/README.md#creating-and-reading-secrets
  source_revision: a53b46392c
  summary: The source can obtain the privileges of any ServiceAccount in the namespace by having the token controller populate a token Secret it can read.
  requires:
    all_of:
      - verb: create
        resource: secrets
        namespace: "{target.namespace}"
    any_of:
      - - verb: get
          resource: secrets
          namespace: "{target.namespace}"
      - - verb: list
          resource: secrets
          namespace: "{target.namespace}"
      - - verb: watch
          resource: secrets
          namespace: "{target.namespace}"
  target:
    kind: k8s_service_account
    selector:
      k8s_sa_in_namespace: "{target.namespace}"
    scope: same_namespace
    aggregate_as: "All ServiceAccounts in {target.namespace}"
  conditions:
    - id: admission_blocks_sa_token_secret
      description: An admission policy (VAP, Kyverno, Gatekeeper) rejecting Secrets of type kubernetes.io/service-account-token would remove the edge.
  blockers: []
  confidence: derived
  severity: critical
  mitigation: Do not combine create and read on secrets for non-admin subjects; deny creation of kubernetes.io/service-account-token Secrets via admission policy.
  references:
    - https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/#manually-create-an-api-token-for-a-serviceaccount
  notes: Manually created token Secrets are still populated by the token controller on current Kubernetes versions. resourceNames cannot restrict create, so a get rule limited to resourceNames still works if it lists the name the source chooses.

- id: k8s-rbac-serviceaccounts-token-create
  provider: k8s
  service: rbac
  title: Mint tokens with the TokenRequest API
  source: src/pentesting-cloud/kubernetes-security/abusing-roles-clusterroles-in-kubernetes/README.md#create-serviceaccounts-token
  source_revision: a53b46392c
  summary: The source can obtain the privileges of the ServiceAccounts on which it can create serviceaccounts/token.
  requires:
    all_of:
      - verb: create
        resource: serviceaccounts
        subresource: token
        namespace: "{target.namespace}"
        resource_name: "{target.name}"
  target:
    kind: k8s_service_account
    selector:
      k8s_sa_in_namespace: "{target.namespace}"
      resource_permission_covers_target: serviceaccounts/token:create
    scope: same_namespace
    aggregate_as: "ServiceAccounts tokenable in {target.namespace}"
  conditions: []
  blockers: []
  confidence: derived
  severity: critical
  mitigation: Grant create on serviceaccounts/token only to the kubelet/system components that need it, scoped with resourceNames.
  references:
    - https://kubernetes.io/docs/reference/kubernetes-api/authentication-resources/token-request-v1/
  notes: resourceNames on serviceaccounts/token restrict which ServiceAccounts can be targeted (the request names the existing ServiceAccount). Nodes get this implicitly for pods bound to them; that case is modelled in nodes.yaml.

- id: k8s-rbac-impersonate-serviceaccounts
  provider: k8s
  service: rbac
  title: Impersonate ServiceAccounts
  source: src/pentesting-cloud/kubernetes-security/abusing-roles-clusterroles-in-kubernetes/README.md#impersonating-privileged-accounts
  source_revision: a53b46392c
  summary: The source can obtain the privileges of the ServiceAccounts it may impersonate.
  requires:
    all_of:
      - verb: impersonate
        resource: serviceaccounts
        namespace: "{target.namespace}"
        resource_name: "{target.name}"
  target:
    kind: k8s_service_account
    selector:
      k8s_sa_in_namespace: "{target.namespace}"
      resource_permission_covers_target: serviceaccounts:impersonate
    scope: same_namespace
    aggregate_as: "Impersonable ServiceAccounts in {target.namespace}"
  conditions: []
  blockers: []
  confidence: derived
  severity: critical
  mitigation: Remove impersonate on serviceaccounts from non-admin subjects or restrict it with resourceNames to low-privilege accounts.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/user-impersonation/
  notes: Per Kubernetes docs, impersonating a username of the form system:serviceaccount:<ns>:<name> is authorized against the serviceaccounts resource in that namespace, not against users. The impersonated SA username also receives the system:serviceaccounts groups only if the source additionally impersonates them; RBAC bindings to the SA subject apply either way.

- id: k8s-rbac-impersonate-users
  provider: k8s
  service: rbac
  title: Impersonate users
  source: src/pentesting-cloud/kubernetes-security/abusing-roles-clusterroles-in-kubernetes/README.md#impersonating-privileged-accounts
  source_revision: a53b46392c
  summary: The source can obtain the privileges of the users it may impersonate.
  requires:
    all_of:
      - verb: impersonate
        resource: users
        namespace: "*"
        resource_name: "{target.name}"
  target:
    kind: k8s_user
    selector:
      resource_permission_covers_target: users:impersonate
    scope: cluster
    aggregate_as: "Impersonable users in {cluster}"
  conditions: []
  blockers: []
  confidence: derived
  severity: critical
  mitigation: Remove impersonate on users from non-admin subjects or restrict it with resourceNames.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/user-impersonation/
  notes: Users are not API objects; the reachable set is the user names that appear as subjects in RoleBindings/ClusterRoleBindings (only those carry privileges). Usernames of the form system:serviceaccount:* are covered by k8s-rbac-impersonate-serviceaccounts, and system:node:* by k8s-rbac-impersonate-node.

- id: k8s-rbac-impersonate-groups
  provider: k8s
  service: rbac
  title: Impersonate groups (with user impersonation)
  source: src/pentesting-cloud/kubernetes-security/abusing-roles-clusterroles-in-kubernetes/README.md#impersonating-privileged-accounts
  source_revision: a53b46392c
  summary: The source can obtain the privileges of the groups it may impersonate.
  requires:
    all_of:
      - verb: impersonate
        resource: groups
        namespace: "*"
        resource_name: "{target.name}"
      - verb: impersonate
        resource: users
        namespace: "*"
  target:
    kind: k8s_group
    selector:
      resource_permission_covers_target: groups:impersonate
      exclude_names: ["system:masters"]
    scope: cluster
    aggregate_as: "Impersonable groups in {cluster}"
  conditions:
    - id: user_impersonation_name_restricted
      description: Group impersonation requires impersonating some user in the same request; a users resourceNames restriction only limits which user name is sent, any covered name suffices.
  blockers: []
  confidence: derived
  severity: critical
  mitigation: Remove impersonate on groups from non-admin subjects; never allow impersonation of system:masters or groups bound to admin roles.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/user-impersonation/
  notes: Verified in Kubernetes docs that Impersonate-Group requires Impersonate-User. Without impersonate on users this entry does not apply. system:masters is handled by k8s-rbac-impersonate-system-masters.

- id: k8s-rbac-impersonate-system-masters
  provider: k8s
  service: rbac
  title: Impersonate the system:masters group
  source: src/pentesting-cloud/kubernetes-security/abusing-roles-clusterroles-in-kubernetes/README.md#impersonating-privileged-accounts
  source_revision: a53b46392c
  summary: The source can obtain the privileges of cluster-admin through the system:masters group, which bypasses RBAC.
  requires:
    all_of:
      - verb: impersonate
        resource: groups
        namespace: "*"
        resource_name: "system:masters"
      - verb: impersonate
        resource: users
        namespace: "*"
  target:
    kind: k8s_cluster_admin
    selector:
      any_principal_in_scope: true
    scope: cluster
    aggregate_as: "cluster-admin of {cluster}"
  conditions: []
  blockers: []
  confidence: derived
  severity: critical
  mitigation: Never grant impersonate on groups without resourceNames; explicitly exclude system:masters.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/rbac/#user-facing-roles
  notes: Members of system:masters are authorized unconditionally by the API server before RBAC.

- id: k8s-rbac-impersonate-node
  provider: k8s
  service: rbac
  title: Impersonate a node identity
  source: src/pentesting-cloud/kubernetes-security/abusing-roles-clusterroles-in-kubernetes/README.md#impersonating-privileged-accounts
  source_revision: a53b46392c
  summary: The source can obtain the privileges of a node (system:node:<name> in group system:nodes).
  requires:
    all_of:
      - verb: impersonate
        resource: users
        namespace: "*"
        resource_name: "system:node:{target.name}"
      - verb: impersonate
        resource: groups
        namespace: "*"
        resource_name: "system:nodes"
  target:
    kind: k8s_node
    selector:
      resource_permission_covers_target: users:impersonate
    scope: cluster
    aggregate_as: "Impersonable nodes in {cluster}"
  conditions: []
  blockers: []
  confidence: derived
  severity: high
  mitigation: Restrict impersonate on users and groups with resourceNames that exclude system:node:* and system:nodes.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/node/
  notes: The Node authorizer requires both the system:node:<name> username and the system:nodes group. Node identity then reaches the ServiceAccounts of pods on that node (see nodes.yaml).

- id: k8s-rbac-constrained-impersonation-user
  provider: k8s
  service: rbac
  title: Constrained impersonation of a user (user-info mode)
  source: src/pentesting-cloud/kubernetes-security/abusing-roles-clusterroles-in-kubernetes/README.md#constrained-impersonation
  source_revision: a53b46392c
  summary: The source can obtain a subset of the privileges of the users it may impersonate in user-info mode.
  requires:
    all_of:
      - verb: "impersonate:user-info"
        resource: users
        namespace: "*"
        resource_name: "{target.name}"
      - verb: "impersonate-on:user-info:*"
        resource: "*"
        namespace: "*"
  target:
    kind: k8s_user
    selector:
      resource_permission_covers_target: "users:impersonate:user-info"
    scope: cluster
    aggregate_as: "Users impersonable in constrained mode in {cluster}"
  conditions:
    - id: constrained_impersonation_action_subset
      description: Only the verbs/resources granted via impersonate-on:user-info:<verb> are usable while impersonating; the edge is meaningful only if those overlap the target's privileges on sensitive resources.
    - id: constrained_impersonation_enabled
      description: Requires Kubernetes 1.36+ (beta, on by default) or the feature gate.
  blockers: []
  confidence: derived
  severity: high
  mitigation: Grant impersonate:<mode> and impersonate-on:<mode>:<verb> only as narrow, resourceName-scoped pairs for the exact delegated operation.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/user-impersonation/
  notes: The requirement "impersonate-on:user-info:*" means at least one impersonate-on:user-info:<verb> grant on any resource. HackTricks reproduced the identity rule under api group authentication.k8s.io; the official doc example shows core group, so api_group is left unspecified. The source never gains more than the intersection of its impersonate-on grants and the target's own permissions.

- id: k8s-rbac-constrained-impersonation-serviceaccount
  provider: k8s
  service: rbac
  title: Constrained impersonation of a ServiceAccount
  source: src/pentesting-cloud/kubernetes-security/abusing-roles-clusterroles-in-kubernetes/README.md#constrained-impersonation
  source_revision: a53b46392c
  summary: The source can obtain a subset of the privileges of the ServiceAccounts it may impersonate in serviceaccount mode.
  requires:
    all_of:
      - verb: "impersonate:serviceaccount"
        resource: serviceaccounts
        namespace: "{target.namespace}"
        resource_name: "{target.name}"
      - verb: "impersonate-on:serviceaccount:*"
        resource: "*"
        namespace: "*"
  target:
    kind: k8s_service_account
    selector:
      k8s_sa_in_namespace: "{target.namespace}"
      resource_permission_covers_target: "serviceaccounts:impersonate:serviceaccount"
    scope: same_namespace
    aggregate_as: "ServiceAccounts impersonable in constrained mode in {target.namespace}"
  conditions:
    - id: constrained_impersonation_action_subset
      description: Only the verbs/resources granted via impersonate-on:serviceaccount:<verb> are usable while impersonating.
    - id: constrained_impersonation_enabled
      description: Requires Kubernetes 1.36+ (beta, on by default) or the feature gate.
  blockers: []
  confidence: derived
  severity: high
  mitigation: Grant constrained impersonation only as narrow, resourceName-scoped identity/action pairs.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/user-impersonation/
  notes: Official doc example uses core group serviceaccounts with verb impersonate:serviceaccount.

- id: k8s-rbac-constrained-impersonation-node
  provider: k8s
  service: rbac
  title: Constrained impersonation of nodes (arbitrary-node or associated-node mode)
  source: src/pentesting-cloud/kubernetes-security/abusing-roles-clusterroles-in-kubernetes/README.md#constrained-impersonation
  source_revision: a53b46392c
  summary: The source can obtain a subset of the privileges of any node (arbitrary-node) or of the node its pod runs on (associated-node).
  requires:
    all_of: []
    any_of:
      - - verb: "impersonate:arbitrary-node"
          resource: nodes
          namespace: "*"
          resource_name: "{target.name}"
        - verb: "impersonate-on:arbitrary-node:*"
          resource: "*"
          namespace: "*"
      - - verb: "impersonate:associated-node"
          resource: nodes
          namespace: "*"
        - verb: "impersonate-on:associated-node:*"
          resource: "*"
          namespace: "*"
  target:
    kind: k8s_node
    selector:
      resource_permission_covers_target: "nodes:impersonate"
    scope: cluster
    aggregate_as: "Nodes impersonable in constrained mode in {cluster}"
  conditions:
    - id: constrained_impersonation_action_subset
      description: Only the verbs granted via impersonate-on:<mode>:<verb> are usable while impersonating the node.
    - id: associated_node_only_own_node
      description: associated-node mode only reaches the node bound into the source ServiceAccount's pod token (the node running the source's pod); arbitrary-node reaches any covered node.
    - id: constrained_impersonation_enabled
      description: Requires Kubernetes 1.36+ (beta, on by default) or the feature gate.
  blockers: []
  confidence: derived
  severity: high
  mitigation: Do not grant node impersonation modes outside node-agent ServiceAccounts, and scope the impersonate-on verbs tightly.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/user-impersonation/
  notes: The exact resource/api group for the node-mode identity rule could not be confirmed from the official page excerpt; evaluator should match on the verb. The associated-node group needs the extension selector k8s_node_hosting_pod_of_source to narrow the target to the source's own node.

- id: k8s-rbac-bind-clusterrolebinding-cluster-admin
  provider: k8s
  service: rbac
  title: Bind cluster-admin through a ClusterRoleBinding
  source: src/pentesting-cloud/kubernetes-security/abusing-roles-clusterroles-in-kubernetes/README.md#bind
  source_revision: a53b46392c
  summary: The source can obtain the privileges of cluster-admin by binding an admin-equivalent ClusterRole to itself cluster-wide.
  requires:
    all_of:
      - verb: bind
        resource: clusterroles
        api_group: rbac.authorization.k8s.io
        namespace: "*"
        resource_name: "{admin_equivalent_clusterrole}"
    any_of:
      - - verb: create
          resource: clusterrolebindings
          api_group: rbac.authorization.k8s.io
          namespace: "*"
      - - verb: update
          resource: clusterrolebindings
          api_group: rbac.authorization.k8s.io
          namespace: "*"
      - - verb: patch
          resource: clusterrolebindings
          api_group: rbac.authorization.k8s.io
          namespace: "*"
  target:
    kind: k8s_cluster_admin
    selector:
      any_principal_in_scope: true
    scope: cluster
    aggregate_as: "cluster-admin of {cluster}"
  conditions:
    - id: bindable_role_admin_equivalent
      description: The ClusterRole covered by bind must be admin-equivalent (cluster-admin, or rules with wildcard verbs/resources including RBAC/secrets/pods). Binding a weaker ClusterRole only grants that role.
  blockers: []
  confidence: derived
  severity: critical
  mitigation: Do not grant bind on clusterroles (especially without resourceNames) together with clusterrolebinding writes.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/rbac/#restrictions-on-role-binding-creation-or-update
  notes: "{admin_equivalent_clusterrole} = any existing ClusterRole the evaluator classifies as admin-equivalent (cluster-admin by default). update/patch only work on an existing ClusterRoleBinding; resourceNames on create cannot restrict the new binding's name. Without bind, binding writes are limited to roles whose permissions the caller already holds (excluded)."

- id: k8s-rbac-bind-rolebinding-namespace
  provider: k8s
  service: rbac
  title: Bind a powerful Role or ClusterRole inside a namespace
  source: src/pentesting-cloud/kubernetes-security/abusing-roles-clusterroles-in-kubernetes/README.md#bind
  source_revision: a53b46392c
  summary: The source can obtain the privileges of the ServiceAccounts in the namespace by binding a role that grants workload or token control there.
  requires:
    all_of: []
    any_of:
      - - verb: bind
          resource: clusterroles
          api_group: rbac.authorization.k8s.io
          namespace: "{target.namespace}"
        - verb: create
          resource: rolebindings
          api_group: rbac.authorization.k8s.io
          namespace: "{target.namespace}"
      - - verb: bind
          resource: clusterroles
          api_group: rbac.authorization.k8s.io
          namespace: "{target.namespace}"
        - verb: update
          resource: rolebindings
          api_group: rbac.authorization.k8s.io
          namespace: "{target.namespace}"
      - - verb: bind
          resource: clusterroles
          api_group: rbac.authorization.k8s.io
          namespace: "{target.namespace}"
        - verb: patch
          resource: rolebindings
          api_group: rbac.authorization.k8s.io
          namespace: "{target.namespace}"
      - - verb: bind
          resource: roles
          api_group: rbac.authorization.k8s.io
          namespace: "{target.namespace}"
        - verb: create
          resource: rolebindings
          api_group: rbac.authorization.k8s.io
          namespace: "{target.namespace}"
      - - verb: bind
          resource: roles
          api_group: rbac.authorization.k8s.io
          namespace: "{target.namespace}"
        - verb: update
          resource: rolebindings
          api_group: rbac.authorization.k8s.io
          namespace: "{target.namespace}"
      - - verb: bind
          resource: roles
          api_group: rbac.authorization.k8s.io
          namespace: "{target.namespace}"
        - verb: patch
          resource: rolebindings
          api_group: rbac.authorization.k8s.io
          namespace: "{target.namespace}"
  target:
    kind: k8s_service_account
    selector:
      k8s_sa_in_namespace: "{target.namespace}"
    scope: same_namespace
    aggregate_as: "All ServiceAccounts in {target.namespace}"
  conditions:
    - id: bindable_role_grants_identity_path
      description: A Role/ClusterRole covered by bind (respecting resourceNames) must grant a path to ServiceAccounts in the namespace, e.g. pods/controllers create, serviceaccounts/token create, secrets read, or wildcards (admin/edit qualify).
  blockers: []
  confidence: derived
  severity: high
  mitigation: Restrict bind with resourceNames to low-privilege roles and avoid granting rolebinding writes to tenants.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/rbac/#restrictions-on-role-binding-creation-or-update
  notes: A RoleBinding grants a referenced ClusterRole's rules only inside its own namespace. The update/patch groups only apply to existing RoleBindings.

- id: k8s-rbac-escalate-bound-clusterrole
  provider: k8s
  service: rbac
  title: Escalate a ClusterRole already bound to the source
  source: src/pentesting-cloud/kubernetes-security/abusing-roles-clusterroles-in-kubernetes/README.md#escalate
  source_revision: a53b46392c
  summary: The source can obtain the privileges of cluster-admin by adding arbitrary rules to a ClusterRole bound to it cluster-wide.
  requires:
    all_of:
      - verb: escalate
        resource: clusterroles
        api_group: rbac.authorization.k8s.io
        namespace: "*"
        resource_name: "{source_bound_clusterrole}"
    any_of:
      - - verb: update
          resource: clusterroles
          api_group: rbac.authorization.k8s.io
          namespace: "*"
          resource_name: "{source_bound_clusterrole}"
      - - verb: patch
          resource: clusterroles
          api_group: rbac.authorization.k8s.io
          namespace: "*"
          resource_name: "{source_bound_clusterrole}"
  target:
    kind: k8s_cluster_admin
    selector:
      any_principal_in_scope: true
    scope: cluster
    aggregate_as: "cluster-admin of {cluster}"
  conditions:
    - id: escalated_role_bound_cluster_wide
      description: The editable ClusterRole must be bound to the source (or a group it belongs to) by a ClusterRoleBinding; if only bound by RoleBindings the gain is limited to those namespaces.
    - id: aggregated_clusterrole_overwritten
      description: Rules added to an aggregated ClusterRole (aggregationRule) are overwritten by the controller.
  blockers: []
  confidence: derived
  severity: critical
  mitigation: Do not grant escalate on roles/clusterroles to non-admin subjects.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/rbac/#restrictions-on-role-creation-or-update
  notes: "{source_bound_clusterrole} = a ClusterRole referenced by a binding whose subjects include the source. escalate + create roles alone is not enough: binding the new role still needs bind or already-held permissions."

- id: k8s-rbac-escalate-bound-role-namespace
  provider: k8s
  service: rbac
  title: Escalate a Role already bound to the source in a namespace
  source: src/pentesting-cloud/kubernetes-security/abusing-roles-clusterroles-in-kubernetes/README.md#escalate
  source_revision: a53b46392c
  summary: The source can obtain the privileges of the ServiceAccounts in the namespace by adding workload or token rules to a Role bound to it there.
  requires:
    all_of:
      - verb: escalate
        resource: roles
        api_group: rbac.authorization.k8s.io
        namespace: "{target.namespace}"
        resource_name: "{source_bound_role}"
    any_of:
      - - verb: update
          resource: roles
          api_group: rbac.authorization.k8s.io
          namespace: "{target.namespace}"
          resource_name: "{source_bound_role}"
      - - verb: patch
          resource: roles
          api_group: rbac.authorization.k8s.io
          namespace: "{target.namespace}"
          resource_name: "{source_bound_role}"
  target:
    kind: k8s_service_account
    selector:
      k8s_sa_in_namespace: "{target.namespace}"
    scope: same_namespace
    aggregate_as: "All ServiceAccounts in {target.namespace}"
  conditions:
    - id: escalated_role_bound_to_source
      description: The editable Role must be bound to the source by a RoleBinding in the same namespace.
  blockers: []
  confidence: derived
  severity: high
  mitigation: Do not grant escalate on roles to tenants.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/rbac/#restrictions-on-role-creation-or-update
  notes: "{source_bound_role} = a Role in the namespace referenced by a RoleBinding whose subjects include the source."

- id: k8s-rbac-csr-kube-apiserver-client-user
  provider: k8s
  service: certificates
  title: Issue and approve a client certificate for an existing username
  source: src/pentesting-cloud/kubernetes-security/abusing-roles-clusterroles-in-kubernetes/README.md#certificate-signing-requests
  source_revision: a53b46392c
  summary: The source can obtain the privileges of any user (or ServiceAccount username) that has RBAC bindings by self-approving a kube-apiserver-client certificate for it.
  requires:
    all_of:
      - verb: create
        resource: certificatesigningrequests
        api_group: certificates.k8s.io
        namespace: "*"
      - verb: get
        resource: certificatesigningrequests
        api_group: certificates.k8s.io
        namespace: "*"
      - verb: update
        resource: certificatesigningrequests
        subresource: approval
        api_group: certificates.k8s.io
        namespace: "*"
      - verb: approve
        resource: signers
        api_group: certificates.k8s.io
        namespace: "*"
        resource_name: "kubernetes.io/kube-apiserver-client"
  target:
    kind: k8s_user
    selector:
      any_principal_in_scope: true
    scope: cluster
    aggregate_as: "Users bound in RBAC in {cluster}"
  conditions:
    - id: kube_apiserver_client_signer_enabled
      description: The controller-manager must be signing kubernetes.io/kube-apiserver-client (cluster-signing key configured; some managed offerings disable or restrict it).
    - id: client_cert_auth_honored
      description: The API server must accept client certificates from the cluster CA (some managed clusters ignore or restrict them).
  blockers: []
  confidence: derived
  severity: critical
  mitigation: Restrict approve on signers and certificatesigningrequests/approval to cluster administrators; never combine them with CSR create for other subjects.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/certificate-signing-requests/#kubernetes-signers
  notes: HackTricks reproduced on v1.37 that this signer refused a CSR requesting system:masters, so cluster-admin through that group is NOT claimed; groups are modelled in k8s-rbac-csr-kube-apiserver-client-group. RBAC ServiceAccount subjects match by username, so a certificate with CN=system:serviceaccount:<ns>:<name> also receives that SA's bindings; the evaluator should include SA usernames in the reachable set. Client certificates cannot be revoked short of rotating the CA.

- id: k8s-rbac-csr-kube-apiserver-client-group
  provider: k8s
  service: certificates
  title: Issue and approve a client certificate carrying groups
  source: src/pentesting-cloud/kubernetes-security/abusing-roles-clusterroles-in-kubernetes/README.md#certificate-signing-requests
  source_revision: a53b46392c
  summary: The source can obtain the privileges of RBAC-bound groups (other than system:masters) by self-approving a kube-apiserver-client certificate with those organizations.
  requires:
    all_of:
      - verb: create
        resource: certificatesigningrequests
        api_group: certificates.k8s.io
        namespace: "*"
      - verb: get
        resource: certificatesigningrequests
        api_group: certificates.k8s.io
        namespace: "*"
      - verb: update
        resource: certificatesigningrequests
        subresource: approval
        api_group: certificates.k8s.io
        namespace: "*"
      - verb: approve
        resource: signers
        api_group: certificates.k8s.io
        namespace: "*"
        resource_name: "kubernetes.io/kube-apiserver-client"
  target:
    kind: k8s_group
    selector:
      any_principal_in_scope: true
      exclude_names: ["system:masters"]
    scope: cluster
    aggregate_as: "Groups bound in RBAC in {cluster}"
  conditions:
    - id: kube_apiserver_client_signer_enabled
      description: The controller-manager must be signing kubernetes.io/kube-apiserver-client.
    - id: signer_group_restrictions
      description: Signer or approver policy may refuse specific organizations; system:masters was refused in the HackTricks lab.
  blockers: []
  confidence: derived
  severity: critical
  mitigation: Restrict approve on signers and certificatesigningrequests/approval to cluster administrators.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/certificate-signing-requests/#kubernetes-signers
  notes: Official docs list no subject restrictions for kubernetes.io/kube-apiserver-client beyond approver/signer policy; the system:masters exclusion follows the HackTricks v1.37 lab result.
